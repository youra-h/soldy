<!-- Новый контекст вывод отдаёт тому же представлению: фокус на триггере переживает открытие. -->
@if (slot('trigger'); as trigger) {
	<ng-container
		[ngTemplateOutlet]="trigger"
		[ngTemplateOutletContext]="{
			triggerAria: state()['triggerAria'] ?? {},
			triggerDataset: state()['triggerDataset'] ?? {},
		}"
	/>
}
<!--
	Наборы панели — одним объектом: директива набора на элементе одна. `visible` поповера
	панели не передаётся, как у Vue: `v-show` корня до телепорта не доходит.
-->
<div
	so-frame
	embedded="popover.frame"
	class="so-popover__panel"
	tabindex="-1"
	position="fixed"
	[visible]="state()['open']"
	[contained]="state()['contained']"
	[anchor_anchor]="rootElement()"
	[anchor_placement]="state()['placement']"
	[anchor_offset]="8"
	[so-attributes]="{
		...state()['aria'],
		...state()['panelDataset'],
		...state()['dismiss_ownerAttribute'],
	}"
>
	<!-- Полоса, за которую панель тянут, — пока жест включён. -->
	@if (state()['handleRendered']) {
		<div class="so-popover__handle" aria-hidden="true"></div>
	}
	<!--
		Содержимое раньше крестика: фокус при открытии встаёт на первый элемент содержимого,
		крестик — последняя остановка Tab. `lazyMount` действует только на проекцию.
	-->
	<div class="so-popover__content">
		@if (state()['contentRendered']) {
			<ng-content />
		}
	</div>
	<!-- `@if`, а не `rendered` кнопки: скрытая кнопка с плагинами стояла бы в каждой панели. -->
	@if (state()['closable']) {
		<button
			so-button
			embedded="popover.close"
			type="button"
			class="so-popover__close"
			[so-attributes]="state()['closeAria']"
			(click)="close()"
		>
			@if (slot('close-icon'); as icon) {
				<ng-container [ngTemplateOutlet]="icon" />
			} @else {
				<svg so-icon embedded="popover.close-icon" so-role-icon="close"></svg>
			}
		</button>
	}
</div>
<!-- Слив шаблонов слотов: в основной проекции их якоря легли бы в панель. -->
<ng-content select="ng-template[slot]" />
