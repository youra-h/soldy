<!--
	Кнопки без обработчиков: клики ловит плагин вьюпорта на корне. Роли «влево» у иконок нет:
	у обеих кнопок `arrowRight`, стрелку «назад» зеркалит тема.
-->
<button
	so-button
	embedded="scroller.prev"
	type="button"
	class="so-scroller__prev"
	[size]="state()['size']"
	[disabled]="state()['prevDisabled']"
	[so-attributes]="state()['prevAria']"
>
	@if (slot('prev-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="scroller.prev-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
<!--
	Вьюпорт — он же ряд: лишний узел отрезал бы элементы от роли потребителя, а тема ставит
	снап по прямым детям. `viewportAria` поверх `tabindex`: ряд с roving tabindex решает сам.
-->
<div
	class="so-scroller__viewport"
	[so-attributes]="{
		tabindex:
			state()['viewportTabIndex'] === undefined
				? null
				: (state()['viewportTabIndex'] | soText),
		...state()['viewportAria'],
	}"
>
	<ng-content />
</div>
<button
	so-button
	embedded="scroller.next"
	type="button"
	class="so-scroller__next"
	[size]="state()['size']"
	[disabled]="state()['nextDisabled']"
	[so-attributes]="state()['nextAria']"
>
	@if (slot('next-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="scroller.next-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
<!-- Слив шаблонов слотов: в основной проекции их якоря легли бы во вьюпорт. -->
<ng-content select="ng-template[slot]" />
