<!--
	Корень — сам хост (`<div so-scroller>`), поэтому шаблон — ряд из трёх мест,
	в порядке Vue: кнопка «назад», вьюпорт, кнопка «вперёд». Слоты контракта:
	default — содержимое ленты, prev-icon и next-icon — значки кнопок.

	Кнопки — Button-детали без обработчиков: клики ловит плагин вьюпорта на
	корне. Размер — ленты, выключенность считает ядро (`prevDisabled`,
	`nextDisabled`: выключена лента или упёрлись в край) — тема корень не
	гасит, и `disabled` доезжает до кнопок разметкой. Имя от локали — набор
	`prevAria` или `nextAria`. Вида нет: значения вида объявляет тема, и красит
	она кнопку по контексту (`.so-scroller__prev`).

	Значок — шаблон слота `prev-icon` или `next-icon`, а без слота — иконка роли
	`arrowRight` размером ленты у обеих кнопок: своей роли для «влево» в
	контракте иконок нет, и стрелку «назад» зеркалит тема. В RTL зеркалится
	вторая — это тоже её дело.
-->
<button
	so-button
	embedded="scroller.prev"
	type="button"
	class="so-scroller__prev"
	[size]="state()['size']"
	[disabled]="state()['prevDisabled']"
	[so-attributes]="state()['prevAria']"
>
	@if (slot('prev-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="scroller.prev-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
<!--
	Вьюпорт — он же ряд: обёртки-дорожки между ним и содержимым нет. Это один
	узел с тремя обязанностями — прокручиваемый контейнер, строка содержимого и
	носитель роли от потребителя; лишний узел отрезал бы элементы от этой роли.

	На нём `tabindex` ленты (`viewportTabIndex`: `0`, когда листать есть куда, а
	своих остановок нет) и поверх него — атрибуты потребителя `viewportAria`:
	ряд с roving tabindex сам решает, кому быть остановкой. Директива набора на
	элементе одна, поэтому оба лежат в одном объекте; `tabindex` — строкой, как
	атрибут, а без него — `null`: имя ядро не называет.

	Содержимое — основная проекция, его элементы становятся прямыми детьми
	вьюпорта: по ним тема расставляет точки снапа (`scroll-snap-align`), а
	плагин считает края.
-->
<div
	class="so-scroller__viewport"
	[so-attributes]="{
		tabindex:
			state()['viewportTabIndex'] === undefined
				? null
				: (state()['viewportTabIndex'] | soText),
		...state()['viewportAria'],
	}"
>
	<ng-content />
</div>
<!-- Кнопка «вперёд» — зеркальная пара «назад», см. комментарий выше. -->
<button
	so-button
	embedded="scroller.next"
	type="button"
	class="so-scroller__next"
	[size]="state()['size']"
	[disabled]="state()['nextDisabled']"
	[so-attributes]="state()['nextAria']"
>
	@if (slot('next-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="scroller.next-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
<!--
	Шаблоны слотов значков, которые потребитель написал в ленте, — в слив:
	Angular считает их содержимым, и в основной проекции их якоря легли бы во
	вьюпорт, среди элементов ленты.
-->
<ng-content select="ng-template[slot]" />
