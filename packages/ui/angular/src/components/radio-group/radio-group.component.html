<!--
	Корень — сам хост (`<div so-radio-group>`), поэтому шаблон — только радио.
	Слоты контракта: default — радио, item — подпись радио из данных (scope
	{ item, active }).

	Радио из данных — запасное содержимое `<ng-content>`, по `shown`, как в
	ListBox. Подпись радио — его слот со scope (`default`, scope { active }), и
	проброс — `<ng-template slot>`, уведённый в слив шаблонов радио.

	Шаблон слота, который потребитель написал в группе, уходит в слив в конце:
	в основной проекции он снял бы запасное содержимое — радио из данных.
-->
<ng-content>
	@for (item of state()['shown'] ?? []; track item.uid) {
		<label so-radio-group-item [ctrl]="item">
			@if (slot('item'); as content) {
				<ng-template slot="default" ngProjectAs="ng-template[slot]" let-active="active">
					<ng-container
						[ngTemplateOutlet]="content"
						[ngTemplateOutletContext]="{ item, active }"
					/>
				</ng-template>
			}
		</label>
	}
</ng-content>
<ng-content select="ng-template[slot]" />
