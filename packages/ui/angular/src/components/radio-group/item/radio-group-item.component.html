<!--
	Поле — перед кольцом: кольцо фокуса тема рисует соседним селектором от поля.
	Точка стоит всегда: у неотмеченного тема сжимает её в ноль.
	Вокруг подписи нет пробелов: пустую обёртку тема прячет по `:empty`.
-->
<input
	#control
	class="so-radio-group-item__input"
	type="radio"
	[attr.name]="state()['name'] ?? null"
	[attr.value]="state()['value'] ?? null"
	[checked]="state()['active'] === true"
	[disabled]="state()['disabled'] === true"
	[so-attributes]="state()['aria']"
	(change)="activate()"
/>
<span class="so-radio-group-item__control"
	><span class="so-radio-group-item__indicator"></span
></span>
<span class="so-radio-group-item__text">
	@if (slot('default'); as text) {
		<ng-container
			[ngTemplateOutlet]="text"
			[ngTemplateOutletContext]="{ active: state()['active'] ?? false }"
		/>
	} @else {
		<ng-content />
	}
</span>
