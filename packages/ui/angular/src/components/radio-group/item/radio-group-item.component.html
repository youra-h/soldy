<!--
	Корень — сам хост (`<label so-radio-group-item>`), поэтому шаблон — поле,
	кольцо с точкой и текст подписи. Слот контракта — default, scope
	{ active }.

	Поле помечено `#control`: на него база переносит статические атрибуты
	потребителя, а директива набора кладёт `aria` радио. Стоит перед кольцом:
	кольцо фокуса тема рисует соседним селектором от поля. Визуально поле
	скрыто темой.

	Кольцо и точка — декор без текста: отметку скринридеру сообщает нативный
	`checked`. Точка стоит всегда — у неотмеченного тема сжимает её в ноль.
	Вокруг подписи нет пробелов: пустую обёртку тема прячет по `:empty`.
-->
<input
	#control
	class="s-radio-group-item__input"
	type="radio"
	[attr.name]="state()['name'] ?? null"
	[attr.value]="state()['value'] ?? null"
	[checked]="state()['active'] === true"
	[disabled]="state()['disabled'] === true"
	[so-attributes]="state()['aria']"
	(change)="activate()"
/>
<span class="s-radio-group-item__control"><span class="s-radio-group-item__indicator"></span></span>
<span class="s-radio-group-item__text">
	@if (slot('default'); as text) {
		<ng-container
			[ngTemplateOutlet]="text"
			[ngTemplateOutletContext]="{ active: state()['active'] ?? false }"
		/>
	} @else {
		<ng-content />
	}
</span>
