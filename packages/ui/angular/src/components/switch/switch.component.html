<!-- `#control` — сюда уходит написанное потребителем на корне, кроме класса и стиля. -->
<input
	#control
	type="checkbox"
	[checked]="state()['value'] === true"
	[attr.id]="state()['id'] ?? null"
	[attr.name]="state()['name'] ?? null"
	[disabled]="state()['disabled'] === true"
	[required]="state()['required'] === true"
	[so-attributes]="state()['aria']"
/>
<!-- Дорожка — декор: состояние сообщает нативный `checked`. -->
<span class="so-switch__track" aria-hidden="true">
	<span class="so-switch__track--thumb">
		@if (state()['value']) {
			@if (slot('on'); as on) {
				<ng-container
					[ngTemplateOutlet]="on"
					[ngTemplateOutletContext]="{ value: state()['value'], ctrl: instance() }"
				/>
			}
		} @else {
			@if (slot('off'); as off) {
				<ng-container
					[ngTemplateOutlet]="off"
					[ngTemplateOutletContext]="{ value: state()['value'], ctrl: instance() }"
				/>
			}
		}
	</span>
</span>
