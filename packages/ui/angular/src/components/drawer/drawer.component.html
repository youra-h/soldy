<!--
	Корень — сам хост (`<div so-drawer>`), выезжающая панель, и в цель уезжает
	он, а с `contained` остаётся на месте, поэтому шаблон — то, что у Vue в
	телепорте, в том же порядке: подложка, потом содержимое панели, а в конце —
	слив шаблонов слотов. Слоты контракта: title, default, footer, close-icon.

	Всё рисуется, пока панель на своём месте — в цели или, с `contained`, на
	месте (`placed` базы): слой есть только в браузере, как оверлей CDK, и на
	сервере, до переноса и без цели панели нет. Содержимое остаётся в контексте
	места, где написана панель: DI Angular идёт по дереву объявлений, а не по
	DOM.
-->
@if (placed()) {
	<!--
		Подложка — спутник корня (`#companion`): шаблон рисует её внутри панели, а
		база ставит прямо перед ней — в цели и на месте, — увозит и возвращает
		вместе с ней и прячет с ней. На ней тот же `z-index`, номер слоя,
		открытость и место, что у панели: она гаснет вместе с панелью и внутри
		контейнера накрывает только его. Пометки владельцем у неё нет — для своей
		панели нажатие по ней мимо.
	-->
	<div
		#companion
		class="so-drawer__backdrop"
		[style]="state()['layout_backdropStyles']"
		[so-attributes]="state()['backdropDataset']"
	></div>
	<!--
		Порядок в панели — полоса, заголовок, тело, подвал, потом крестик: фокус
		при открытии попадает на первый контрол содержимого, а крестик — последняя
		остановка Tab.

		Полоса у края, за которую тянут, — пока жест включён. Она говорит, что
		панель можно смахнуть, и сама ничего не делает: потребитель её не
		адресует, скринридеру она не нужна (`aria-hidden`). Закрыть без
		перетаскивания — крестик, подложка и Escape.
	-->
	@if (state()['handleRendered']) {
		<div class="so-drawer__handle" aria-hidden="true"></div>
	}
	<!--
		Заголовок рисуется всегда: на него панель ссылается `aria-labelledby`, и
		`id` для этой ссылки он берёт из `titleAria`. Пробелы вокруг проекции
		Angular вырезает: пустой заголовок и подвал тема сворачивает по `:empty`.
	-->
	<h2 class="so-drawer__title" [so-attributes]="state()['titleAria']">
		<ng-content select="[slot=title]" />
	</h2>
	<!-- Тело — прокручивается оно, шапка и подвал остаются на месте -->
	<div class="so-drawer__body">
		<ng-content />
	</div>
	<div class="so-drawer__footer">
		<ng-content select="[slot=footer]" />
	</div>
	<!--
		Крестик — в углу шапки со стороны конца строки, есть, только пока панель
		можно закрыть им (`@if`, а не `rendered` кнопки: тема опирается на его
		отсутствие в DOM). Он просит панель закрыться: отменить закрытие может
		подписчик `close:before`, куда вернуть фокус, решает плагин фокуса. Вида и
		размера у него нет — кнопку красит тема по контексту. Имя — набор
		`closeAria` от локали.
	-->
	@if (state()['closable']) {
		<button
			so-button
			embedded="drawer.close"
			type="button"
			class="so-drawer__close"
			[so-attributes]="state()['closeAria']"
			(click)="instance()?.requestClose('button')"
		>
			@if (slot('close-icon'); as icon) {
				<ng-container [ngTemplateOutlet]="icon" />
			} @else {
				<svg so-icon embedded="drawer.close-icon" so-role-icon="close"></svg>
			}
		</button>
	}
}
<!--
	Шаблоны слотов, которые потребитель написал в панели, — в слив, в конце
	корня и вне ветки: Angular считает их содержимым, и в основной проекции их
	якоря легли бы в тело панели.
-->
<ng-content select="ng-template[slot]" />
