<!--
	Плитка — `div`, а не `span`: в слот кладут и блочное. Номер — `[textContent]`, а не
	интерполяцией: от отступа Prettier Angular оставил бы пробелы.
-->
@if (slot('default'); as content) {
	<div class="so-calendar-item__day">
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{ text: state()['text'] ?? '' }"
		/>
	</div>
} @else {
	<div class="so-calendar-item__day" [textContent]="state()['text'] ?? ''"></div>
}
