<!--
	Корень — сам хост (`<td so-calendar-item>`), ячейка сетки, поэтому шаблон —
	только плитка дня. Слот контракта: default (scope { text }) — содержимое
	дня, шаблоном.

	Плитка — то, что видно выбранным: заливка, наведение, кольцо фокуса, рамка
	«сегодня»; стоит поверх полосы диапазона, которую тема рисует
	псевдоэлементом ячейки. `div`, а не `span`: в слот кладут и блочное
	содержимое. Шаблон `default` получает номер дня в цифрах локали (`text`), а
	без него в плитке — сам номер. Номер — свойством плитки (`textContent`), а
	не интерполяцией: Prettier переносит содержимое элемента на свою строку, и
	Angular оставил бы от отступа пробелы по краям номера.
-->
@if (slot('default'); as content) {
	<div class="so-calendar-item__day">
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{ text: state()['text'] ?? '' }"
		/>
	</div>
} @else {
	<div class="so-calendar-item__day" [textContent]="state()['text'] ?? ''"></div>
}
