<!--
	Ручки и метки — по месту (`track $index`): записи выходов новые на каждую смену, а узел
	ручки с полем остаётся тем же. Края дорожки — 0 % и 100 % значения; ручку и поле плагины
	находят прямыми детьми: `__thumb` — дорожки, `input` — ручки.
-->
<span class="so-slider__track">
	<span class="so-slider__range" [style]="state()['rangeStyle']"></span>
	<!--
		Метки под `aria-hidden`: в подписи `Label` их текст вошёл бы в имя поля. Подпись
		без текста — узел без детей: тема прячет её по `:empty`.
	-->
	@if ((state()['shownMarks'] ?? []).length > 0) {
		<span class="so-slider__marks" aria-hidden="true">
			@for (mark of state()['shownMarks'] ?? []; track $index) {
				<span class="so-slider__mark" [style]="mark.style" [so-attributes]="mark.dataset">
					@if (slot('mark'); as content) {
						<span class="so-slider__mark-label"
							><ng-container
								[ngTemplateOutlet]="content"
								[ngTemplateOutletContext]="{
									value: mark.value,
									label: mark.label,
								}"
						/></span>
					} @else {
						<span class="so-slider__mark-label" [textContent]="mark.label ?? ''"></span>
					}
				</span>
			}
		</span>
	}
	<!-- Подсказка со значением — внутри ручки, поэтому едет за ней сама. -->
	@for (thumb of state()['thumbs'] ?? []; track $index) {
		<span class="so-slider__thumb" [style]="thumb.style" [so-attributes]="thumb.dataset">
			<!--
				Нативное поле: его двигает жест мобильного скринридера, форму даёт браузер.
				Значение — директивой после хода: раньше нового `max` оно встало бы на прежний край.
			-->
			<input
				class="so-slider__input"
				type="range"
				[min]="thumb.min"
				[max]="thumb.max"
				[step]="thumb.step"
				[so-field-text]="thumb.value | soText"
				[attr.name]="state()['name'] ?? null"
				[disabled]="state()['disabled'] === true"
				[so-attributes]="thumb.aria"
			/>
			@if (state()['tooltipRendered']) {
				@if (slot('thumb'); as content) {
					<span class="so-slider__tooltip" aria-hidden="true"
						><ng-container
							[ngTemplateOutlet]="content"
							[ngTemplateOutletContext]="{ value: thumb.value, index: $index }"
					/></span>
				} @else {
					<span
						class="so-slider__tooltip"
						aria-hidden="true"
						[textContent]="thumb.value | soText"
					></span>
				}
			}
		</span>
	}
</span>
