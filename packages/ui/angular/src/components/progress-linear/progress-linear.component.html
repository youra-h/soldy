<!--
	Корень — сам хост (`<span so-progress-linear>`), он же дорожка во всю длину,
	поэтому шаблон — только заливка доли. Разметка статическая: размер, вариант
	и ось, доля, бег, роль, значения и имя для скринридера приходят на корень
	кодом, здесь только состав и имя класса.

	Текста и слотов нет: содержимое узла с ролью `progressbar` скринридер не
	читает, а в тонкую полосу текст не влезет. Подпись и число потребитель
	ставит рядом своей разметкой, а написанное внутри элемента не выводится.

	Заливка — доля готового от начала строки, в RTL — справа, у вертикальной
	полосы — снизу. Длина — из переменной на корне. Пока полоса бежит, заливку
	тема прячет, а бег рисует псевдоэлементом корня: своего узла у бегущего
	отрезка нет. Заливка — `span`, как корень: полосу кладут в строчную разметку.
-->
<span class="so-progress-linear__range"></span>
