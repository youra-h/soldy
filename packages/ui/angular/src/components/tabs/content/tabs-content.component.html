<!--
	Корень — сам хост (`<div so-tabs-content>`), поэтому шаблон — только
	содержимое панели. Слот контракта — default.

	Содержимое — пока панель активна: неактивную база прячет, а её содержимое в
	документ не вставляется. `<ng-content>` объявлен один раз.
-->
@if (state()['active']) {
	<ng-content />
}
