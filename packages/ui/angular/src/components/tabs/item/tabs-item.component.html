<!--
	Крестик — `@if`, а не `rendered` кнопки: у Angular тот прячет корень, и скрытая
	кнопка со своими плагинами стояла бы у каждого таба.
-->
<button
	so-button
	#control
	embedded="tabs.row"
	type="button"
	[disabled]="state()['disabled']"
	[size]="state()['size']"
	[variant]="state()['variant']"
	[so-attributes]="state()['aria']"
	(click)="activate()"
>
	<ng-container ngProjectAs="[slot=leading]">
		<ng-content select="[slot=leading]" />
	</ng-container>
	@if (slot('default'); as content) {
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{
				text: state()['text'] ?? '',
				active: state()['active'] ?? false,
			}"
		/>
	} @else {
		<ng-content>{{ state()['text'] }}</ng-content>
	}
	<ng-container ngProjectAs="[slot=trailing]">
		<ng-content select="[slot=trailing]" />
	</ng-container>
</button>
@if (state()['tab_closable']) {
	<button
		so-button
		embedded="tabs.close"
		type="button"
		class="so-tabs-item__close"
		[disabled]="state()['disabled']"
		[size]="state()['size']"
		[so-attributes]="state()['closeAria']"
		(click)="close($event)"
	>
		@if (slot('close-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg
				so-icon
				embedded="tabs.close-icon"
				so-role-icon="close"
				[size]="state()['size']"
			></svg>
		}
	</button>
}
<ng-content select="ng-template[slot]" />
