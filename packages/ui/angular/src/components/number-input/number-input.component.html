<!--
	Корень — сам хост (`<div so-number-input>`), поэтому шаблон — то, что
	внутри коробки поля, в порядке Vue: слот `leading`, ввод, обёртка у конца
	числа, кнопки шага и значение для формы. Кнопки шага — последними из
	видимых, у края поля: их место не зависит от того, чем заняты слоты. Слоты
	контракта: leading и trailing (scope { ctrl }), clear (scope { clear }),
	decrement-icon и increment-icon.

	Ввод помечен `#control`: на него ложится то, что потребитель написал на
	корне, кроме класса и стиля, — статику переносит база, привязки и слушатели
	доносит рендерер адаптера, — а директива набора кладёт наборы ядра.
	Обработчик в разметке один — клик кнопки очистки: набор, клавиши и кнопки
	шага ловят плагины на корне.
-->
@if (slot('leading'); as leading) {
	<div class="so-number-input__leading">
		<ng-container
			[ngTemplateOutlet]="leading"
			[ngTemplateOutletContext]="{ ctrl: instance() }"
		/>
	</div>
}
<!--
	Ввод — число в формате языка одной строкой от Intl: «1 234,5», «12 %».
	Текст — буфер правки ядра (`text`), а не `value`: пока набирают, набранное,
	после — строка формата; в узел его пишет директива текста поля, только когда
	он разошёлся с узлом. Наборы ядра — одним объектом в порядке Vue: директива
	на элементе одна. `inputAttrs` — `dir` и `lang` числа и `inputmode`, `aria`
	— имя, справка, ошибка, `inputAria` — роль `spinbutton` и `aria-value*`.
	По классу ввод находят плагины поля: рядом в корне лежит скрытое поле
	формы. `name` у ввода нет — в форму уходит число, а не текст. Ни проверки
	орфографии, ни автозаполнения: число — не слово.
-->
<input
	#control
	type="text"
	class="so-number-input__input"
	autocomplete="off"
	spellcheck="false"
	[so-field-text]="state()['text']"
	[attr.id]="state()['id'] ?? null"
	[attr.placeholder]="state()['placeholder'] ?? null"
	[disabled]="state()['disabled'] === true"
	[readOnly]="state()['readonly'] === true"
	[required]="state()['required'] === true"
	[so-attributes]="{ ...state()['inputAttrs'], ...state()['aria'], ...state()['inputAria'] }"
/>
<!--
	Обёртка у конца числа — как у Input: по кнопке очистки, по своей кнопке в
	слоте `clear` или по слоту `trailing`. Кнопка очистки стоит в ней первой,
	перед содержимым `trailing`.
-->
@if (state()['clearable'] || slot('clear') || slot('trailing')) {
	<div class="so-number-input__trailing">
		<!--
			Своя кнопка — слот `clear`: заменяет встроенную целиком и рисуется,
			когда задана. Команду очистки получает в scope.
		-->
		@if (slot('clear'); as clear) {
			<ng-container
				[ngTemplateOutlet]="clear"
				[ngTemplateOutletContext]="{ clear: instance()?.clear }"
			/>
		} @else if (state()['clearable']) {
			<button
				so-button
				embedded="number-input.clear"
				type="button"
				class="so-number-input__clear"
				[size]="state()['size']"
				[disabled]="state()['disabled']"
				[so-attributes]="state()['clearAria']"
				(click)="clearClick($event)"
			>
				<svg
					so-icon
					embedded="number-input.clear-icon"
					so-role-icon="close"
					[size]="state()['size']"
				></svg>
			</button>
		}
		@if (slot('trailing'); as trailing) {
			<ng-container
				[ngTemplateOutlet]="trailing"
				[ngTemplateOutletContext]="{ ctrl: instance() }"
			/>
		}
	</div>
}
<!--
	Кнопки шага — всегда: «меньше», затем «больше». По классам их находит
	плагин кнопок, обработчиков у них нет. Набор кнопки — имя от локали и
	`tabindex="-1"` (`decrementAria`) и `data-pressed` удержания
	(`decrementDataset`) — одним объектом, по той же причине, что у ввода.
	Значок — шаблон слота `decrement-icon` или `increment-icon`: заменяется
	значок, а кнопка с удержанием остаётся своей; без слота — иконка роли
	`minus` или `plus` размером поля.
-->
<div class="so-number-input__stepper">
	<button
		so-button
		embedded="number-input.decrement"
		type="button"
		class="so-number-input__decrement"
		[size]="state()['size']"
		[disabled]="state()['decrementDisabled']"
		[so-attributes]="{ ...state()['decrementAria'], ...state()['decrementDataset'] }"
	>
		@if (slot('decrement-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg
				so-icon
				embedded="number-input.decrement-icon"
				so-role-icon="minus"
				[size]="state()['size']"
			></svg>
		}
	</button>
	<button
		so-button
		embedded="number-input.increment"
		type="button"
		class="so-number-input__increment"
		[size]="state()['size']"
		[disabled]="state()['incrementDisabled']"
		[so-attributes]="{ ...state()['incrementAria'], ...state()['incrementDataset'] }"
	>
		@if (slot('increment-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg
				so-icon
				embedded="number-input.increment-icon"
				so-role-icon="plus"
				[size]="state()['size']"
			></svg>
		}
	</button>
</div>
<!--
	Значение для формы — скрытое поле последним: `name`, `value` — число
	строкой («1234.5», а не «1 234,5 ₽»), без числа — пусто, правилом ядра
	(`soText`). Выключенное поле в форму не уходит.
-->
<input
	type="hidden"
	[attr.name]="state()['name'] ?? null"
	[value]="state()['value'] | soText"
	[disabled]="state()['disabled'] === true"
/>
