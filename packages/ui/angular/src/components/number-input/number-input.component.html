@if (slot('leading'); as leading) {
	<div class="so-number-input__leading">
		<ng-container
			[ngTemplateOutlet]="leading"
			[ngTemplateOutletContext]="{ ctrl: instance() }"
		/>
	</div>
}
<!-- Текст — буфер правки ядра (`text`), а не `value`; в форму число уходит скрытым полем. -->
<input
	#control
	type="text"
	class="so-number-input__input"
	autocomplete="off"
	spellcheck="false"
	[so-field-text]="state()['text']"
	[attr.id]="state()['id'] ?? null"
	[attr.placeholder]="state()['placeholder'] ?? null"
	[disabled]="state()['disabled'] === true"
	[readOnly]="state()['readonly'] === true"
	[required]="state()['required'] === true"
	[so-attributes]="{ ...state()['inputAttrs'], ...state()['aria'], ...state()['inputAria'] }"
/>
@if (state()['clearable'] || slot('clear') || slot('trailing')) {
	<div class="so-number-input__trailing">
		@if (slot('clear'); as clear) {
			<ng-container
				[ngTemplateOutlet]="clear"
				[ngTemplateOutletContext]="{ clear: instance()?.clear }"
			/>
		} @else if (state()['clearable']) {
			<button
				so-button
				embedded="number-input.clear"
				type="button"
				class="so-number-input__clear"
				[size]="state()['size']"
				[disabled]="state()['disabled']"
				[so-attributes]="state()['clearAria']"
				(click)="clearClick($event)"
			>
				<svg
					so-icon
					embedded="number-input.clear-icon"
					so-role-icon="close"
					[size]="state()['size']"
				></svg>
			</button>
		}
		@if (slot('trailing'); as trailing) {
			<ng-container
				[ngTemplateOutlet]="trailing"
				[ngTemplateOutletContext]="{ ctrl: instance() }"
			/>
		}
	</div>
}
<!-- Обработчиков у кнопок шага нет: их находит по классам плагин кнопок. -->
<div class="so-number-input__stepper">
	<button
		so-button
		embedded="number-input.decrement"
		type="button"
		class="so-number-input__decrement"
		[size]="state()['size']"
		[disabled]="state()['decrementDisabled']"
		[so-attributes]="{ ...state()['decrementAria'], ...state()['decrementDataset'] }"
	>
		@if (slot('decrement-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg
				so-icon
				embedded="number-input.decrement-icon"
				so-role-icon="minus"
				[size]="state()['size']"
			></svg>
		}
	</button>
	<button
		so-button
		embedded="number-input.increment"
		type="button"
		class="so-number-input__increment"
		[size]="state()['size']"
		[disabled]="state()['incrementDisabled']"
		[so-attributes]="{ ...state()['incrementAria'], ...state()['incrementDataset'] }"
	>
		@if (slot('increment-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg
				so-icon
				embedded="number-input.increment-icon"
				so-role-icon="plus"
				[size]="state()['size']"
			></svg>
		}
	</button>
</div>
<!-- Значение для формы — число строкой («1234.5»); выключенное поле в форму не уходит. -->
<input
	type="hidden"
	[attr.name]="state()['name'] ?? null"
	[value]="state()['value'] | soText"
	[disabled]="state()['disabled'] === true"
/>
