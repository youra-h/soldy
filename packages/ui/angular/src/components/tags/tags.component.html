<!--
	Шаблон `default` заменяет и теги разметки, и теги из данных: каждый тег рисуется один раз.
	Слоты тега без scope — проекцией (`ngProjectAs`), остальные — шаблонами в его слив.
	Шаблоны слотов набора — в слив в конце: иначе сняли бы теги из данных.
-->
@if (slot('default'); as layout) {
	<ng-container
		[ngTemplateOutlet]="layout"
		[ngTemplateOutletContext]="{ shown: state()['shown'] ?? [] }"
	/>
} @else {
	<ng-content>
		@for (item of state()['shown'] ?? []; track item.uid) {
			<div so-tags-item [ctrl]="item">
				@if (slot('item-leading'); as leading) {
					<ng-container ngProjectAs="[slot=leading]">
						<ng-container
							[ngTemplateOutlet]="leading"
							[ngTemplateOutletContext]="{ item }"
						/>
					</ng-container>
				}
				@if (slot('item'); as content) {
					<ng-template
						slot="default"
						ngProjectAs="ng-template[slot]"
						let-text="text"
						let-selected="selected"
					>
						<ng-container
							[ngTemplateOutlet]="content"
							[ngTemplateOutletContext]="{ item, text, selected }"
						/>
					</ng-template>
				}
				@if (slot('item-trailing'); as trailing) {
					<ng-container ngProjectAs="[slot=trailing]">
						<ng-container
							[ngTemplateOutlet]="trailing"
							[ngTemplateOutletContext]="{ item }"
						/>
					</ng-container>
				}
				@if (slot('item-close-icon'); as icon) {
					<ng-template slot="close-icon" ngProjectAs="ng-template[slot]">
						<ng-container
							[ngTemplateOutlet]="icon"
							[ngTemplateOutletContext]="{ item }"
						/>
					</ng-template>
				}
			</div>
		}
	</ng-content>
}
<ng-content select="ng-template[slot]" />
