<!-- Часть стоит, пока задан её текст: ссылки на части ставит ядро, а слотов оно не видит. -->
@if (state()['label']) {
	<label class="so-field__label" [so-attributes]="state()['labelAria']"
		><ng-content select="[slot=label-content]">{{ state()['label'] }}</ng-content></label
	>
}
<div class="so-field__control"><ng-content /></div>
<!-- В подсказке бывают ссылки и списки, отсюда `div`. -->
@if (state()['helperRendered']) {
	<div class="so-field__helper" [so-attributes]="state()['helperAria']">
		<ng-content select="[slot=helper-content]">{{ state()['helper'] }}</ng-content>
	</div>
}
<!-- Текст ошибки — в своей обёртке: ряд из значка и текста — флекс. -->
@if (state()['errorRendered']) {
	<div class="so-field__error" [so-attributes]="state()['errorAria']">
		<svg
			so-icon
			embedded="field.error-icon"
			class="so-field__error-icon"
			so-role-icon="error"
		></svg>
		<div class="so-field__error-text">
			<ng-content select="[slot=error-content]">{{ state()['error'] }}</ng-content>
		</div>
	</div>
}
