<!--
	Корень — сам хост (`<div so-field>`), поэтому шаблон — только части поля.
	Слоты контракта: default — контрол, label-content, helper-content и
	error-content — своя разметка частей вместо текста
	(`<b slot="label-content">`).

	Подпись — проп `label`, своя разметка — слот `label-content`. Связку с
	контролом — `id` и `for` — несёт набор `labelAria`: `for` на поле у
	контролов с `<input>`, а группу (RadioGroup) называет ссылка
	`aria-labelledby` на `id`. Только сама подпись: её текст — доступное имя
	контрола, и описание сюда не кладут.
-->
@if (state()['label']) {
	<label class="so-field__label" [so-attributes]="state()['labelAria']"
		><ng-content select="[slot=label-content]">{{ state()['label'] }}</ng-content></label
	>
}
<!-- Контрол — слот default: Input, CheckBox, Switch, RadioGroup или Label с контролом -->
<div class="so-field__control"><ng-content /></div>
<!--
	Подсказка — проп `helper`, своя разметка — слот `helper-content`: в ней
	бывают ссылки и списки, отсюда `div`. Её `id` (набор `helperAria`) — в
	`aria-describedby` контрола.
-->
@if (state()['helperRendered']) {
	<div class="so-field__helper" [so-attributes]="state()['helperAria']">
		<ng-content select="[slot=helper-content]">{{ state()['helper'] }}</ng-content>
	</div>
}
<!--
	Ошибка — проп `error`, своя разметка — слот `error-content`; её `id` (набор
	`errorAria`) — в `aria-describedby` контрола вместо подсказки. Значок — роль
	`error`, декор: смысл несёт текст. Размера у значка нет: его ставит тема — в
	кегль ошибки. Текст — в своей обёртке: ряд из значка и текста — флекс.
-->
@if (state()['errorRendered']) {
	<div class="so-field__error" [so-attributes]="state()['errorAria']">
		<svg
			so-icon
			embedded="field.error-icon"
			class="so-field__error-icon"
			so-role-icon="error"
		></svg>
		<div class="so-field__error-text">
			<ng-content select="[slot=error-content]">{{ state()['error'] }}</ng-content>
		</div>
	</div>
}
