<!--
	Слот default со scope — шаблоном: `<ng-content>` данных не передаёт. Шаблон
	тоже проекция, и запасной текст при нём не рисуется.
-->
<ng-content select="[slot=leading]" />

<span class="so-button__text">
	<ng-content>{{ state()['text'] }}</ng-content>

	@if (slot('default'); as defaultSlot) {
		<ng-container
			[ngTemplateOutlet]="defaultSlot"
			[ngTemplateOutletContext]="{ $implicit: state()['text'], text: state()['text'] }"
		/>
	}
</span>

<ng-content select="[slot=trailing]" />
