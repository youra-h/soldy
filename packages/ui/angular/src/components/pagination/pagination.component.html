<!--
	Корень — сам хост (`<nav so-pagination>`), поэтому шаблон — ряд в одну
	строку: стрелка «назад», список страниц, стрелка «вперёд». Слоты контракта:
	item — содержимое страницы (scope { item, text }), prev-icon и next-icon —
	значки стрелок.

	Стрелки стоят вне списка: в списке только страницы и пропуски. Отдельных
	кнопок «в начало» и «в конец» нет — их роль играют первая и последняя
	страницы, они видны всегда.

	Стрелка «назад» — на предыдущую страницу (`prev()`). `size` и `variant` —
	пагинации: цвет тема берёт с модификатора кнопки. Выключенность считает
	пагинация (`prevDisabled`: первая страница, текущей нет или выключен
	компонент), имя из локали — в наборе `prevAria`. Вида нет: `plain` и
	квадрат даёт тема по контексту. Значок — шаблон слота `prev-icon`, без него —
	иконка роли `arrowRight`, у обеих стрелок: «назад» тема зеркалит по
	направлению строки.
-->
<button
	so-button
	embedded="pagination.prev"
	type="button"
	class="so-pagination__prev"
	[size]="state()['size']"
	[variant]="state()['variant']"
	[disabled]="state()['prevDisabled']"
	[so-attributes]="state()['prevAria']"
	(click)="instance()?.prev()"
>
	@if (slot('prev-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="pagination.prev-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
<!--
	Страницы и пропуски — по порядку окна (`cells`): первая страница, пропуск, N
	страниц вокруг текущей, пропуск, последняя (`1 … 4 5 6 … 10`). Страница —
	элемент коллекции; в коллекции только страницы окна. Пропуск — разметка
	владельца там, где между соседними страницами окна пропущены две и больше.

	Ключ места — `cell.key`: у страницы её `uid`. Страница, оставшаяся на экране
	при сдвиге окна, — тот же экземпляр, и узел с фокусом на нём не
	пересобирается.

	Слот страницы пробрасывается целиком и только заданный: `item`, scope —
	scope слота страницы (`text`) плюс сама страница. Проброс — шаблон
	`default` страницы с `ngProjectAs`: он уходит в слив её шаблонов, а не в
	основную проекцию, где снял бы её запасной текст.
-->
<ol class="so-pagination__list">
	@for (cell of state()['cells'] ?? []; track cell.key) {
		@if (cell.kind === 'item') {
			<li so-pagination-item [ctrl]="cell.item">
				@if (slot('item'); as content) {
					<ng-template slot="default" ngProjectAs="ng-template[slot]" let-text="text">
						<ng-container
							[ngTemplateOutlet]="content"
							[ngTemplateOutletContext]="{ item: cell.item, text }"
						/>
					</ng-template>
				}
			</li>
		} @else {
			<!--
				Пропуск — не кнопка и не иконка: на нём ничего не нажимают, и фокуса
				у него нет. Многоточие — текстом. Клетку той же ширины, что узкая
				страница, даёт тема.
			-->
			<li class="so-pagination__ellipsis">…</li>
		}
	}
</ol>
<!--
	Стрелка «вперёд» — на следующую страницу (`next()`); выключена на последней
	(`nextDisabled`). Остальное — как у «назад», имя из локали — в наборе
	`nextAria`, слот — `next-icon`.
-->
<button
	so-button
	embedded="pagination.next"
	type="button"
	class="so-pagination__next"
	[size]="state()['size']"
	[variant]="state()['variant']"
	[disabled]="state()['nextDisabled']"
	[so-attributes]="state()['nextAria']"
	(click)="instance()?.next()"
>
	@if (slot('next-icon'); as icon) {
		<ng-container [ngTemplateOutlet]="icon" />
	} @else {
		<svg
			so-icon
			embedded="pagination.next-icon"
			so-role-icon="arrowRight"
			[size]="state()['size']"
		></svg>
	}
</button>
