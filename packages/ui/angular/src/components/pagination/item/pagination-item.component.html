<!--
	Корень — сам хост (`<li so-pagination-item>`), поэтому шаблон — строка:
	Button с номером или текстом страницы. Слот контракта — default, scope
	{ text }: его пробрасывает пагинация из своего слота `item`.

	Вида у строки нет: `plain`, у текущей — заливку, и квадрат узкого номера
	даёт тема по контексту. Набор `aria` — `aria-current="page"` у текущей —
	кладёт на строку директива набора.

	Текст по умолчанию — ветка: шаблон `default` задан — он, иначе
	`<ng-content>` с текстом страницы запасным содержимым. Шаблон, который
	пробросил владелец, уходит в слив в конце: в основной проекции он снял бы
	запасной текст.
-->
<button
	so-button
	embedded="pagination.page"
	type="button"
	[disabled]="state()['disabled']"
	[size]="state()['size']"
	[variant]="state()['variant']"
	[so-attributes]="state()['aria']"
	(click)="activate()"
>
	@if (slot('default'); as content) {
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{ text: state()['text'] ?? '' }"
		/>
	} @else {
		<ng-content>{{ state()['text'] }}</ng-content>
	}
</button>
<ng-content select="ng-template[slot]" />
