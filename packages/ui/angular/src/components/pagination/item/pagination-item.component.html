<!--
	Вида у строки нет: `plain`, заливку текущей и квадрат узкого номера даёт тема.
	Шаблон `default` от пагинации — в слив в конце: в основной проекции снял бы текст.
-->
<button
	so-button
	embedded="pagination.page"
	type="button"
	[disabled]="state()['disabled']"
	[size]="state()['size']"
	[variant]="state()['variant']"
	[so-attributes]="state()['aria']"
	(click)="activate()"
>
	@if (slot('default'); as content) {
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{ text: state()['text'] ?? '' }"
		/>
	} @else {
		<ng-content>{{ state()['text'] }}</ng-content>
	}
</button>
<ng-content select="ng-template[slot]" />
