<!--
	Корень — сам хост (`<div so-skeleton>`), поэтому шаблон — заглушка и
	содержимое элемента. Слот контракта — default: настоящее содержимое.

	Заглушка декоративна: она изображает будущий текст, а не является им.
	`aria-hidden` стоит на ней, а не на корне — в корне лежит настоящее
	содержимое, и скрывать его нельзя. Показана она, пока `present`: `visible`
	и `rendered` убирают только её.

	`<ng-content>` — вне `@if`: содержимое от заглушки не зависит, а проекция,
	объявленная в ветке, терялась бы при её смене.
-->
@if (state()['present']) {
	<div class="so-skeleton__placeholder" aria-hidden="true"></div>
}
<ng-content />
