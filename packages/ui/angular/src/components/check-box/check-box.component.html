<!-- `#control` — сюда уходит написанное потребителем на корне, кроме класса и стиля. -->
<input
	#control
	type="checkbox"
	[checked]="state()['value'] === true"
	[indeterminate]="state()['indeterminate'] === true"
	[attr.id]="state()['id'] ?? null"
	[attr.name]="state()['name'] ?? null"
	[disabled]="state()['disabled'] === true"
	[required]="state()['required'] === true"
	[so-attributes]="state()['aria']"
/>
<!--
	Коробка — декор: состояние сообщают нативные `checked` и `indeterminate`. Отметка —
	`<svg>`, а не компонент Icon: в таблице «выбрать все» их собирались бы тысячи.
-->
<span class="so-check-box__container" aria-hidden="true">
	@if (state()['indeterminate']) {
		@if (slot('indeterminate-icon'); as mark) {
			<ng-container
				[ngTemplateOutlet]="mark"
				[ngTemplateOutletContext]="{
					value: state()['value'],
					indeterminate: true,
				}"
			/>
		} @else {
			<svg class="so-check-box__mark" so-role-icon="checkIndeterminate"></svg>
		}
	} @else if (state()['value']) {
		@if (slot('icon'); as mark) {
			<ng-container
				[ngTemplateOutlet]="mark"
				[ngTemplateOutletContext]="{ value: state()['value'], indeterminate: false }"
			/>
		} @else {
			<svg class="so-check-box__mark" so-role-icon="check"></svg>
		}
	}
</span>
