<!--
	Корень — сам хост (`<so-check-box>`), поэтому шаблон — поле и коробка.
	Слоты контракта: icon и indeterminate-icon, scope { value, indeterminate }.

	Поле помечено `#control`: на него база переносит статические атрибуты
	потребителя, а директива набора кладёт `aria` ядра.
-->
<input
	#control
	type="checkbox"
	[checked]="state()['value'] === true"
	[indeterminate]="state()['indeterminate'] === true"
	[attr.id]="state()['id'] ?? null"
	[attr.name]="state()['name'] ?? null"
	[disabled]="state()['disabled'] === true"
	[required]="state()['required'] === true"
	[so-attributes]="state()['aria']"
/>
<!--
	Коробка с отметкой — декор: состояние скринридеру сообщают нативные
	`checked` и `indeterminate`. «Выбрано частично» рисуется поверх значения,
	как у Vue: его снимает клик (`toggle` ядра), а не смена `value`.
-->
<span class="so-check-box__container" aria-hidden="true">
	@if (state()['indeterminate']) {
		@if (slot('indeterminate-icon'); as mark) {
			<ng-container
				[ngTemplateOutlet]="mark"
				[ngTemplateOutletContext]="{
					value: state()['value'],
					indeterminate: true,
				}"
			/>
		} @else {
			<svg class="so-check-box__mark" so-role-icon="checkIndeterminate"></svg>
		}
	} @else if (state()['value']) {
		@if (slot('icon'); as mark) {
			<ng-container
				[ngTemplateOutlet]="mark"
				[ngTemplateOutletContext]="{ value: state()['value'], indeterminate: false }"
			/>
		} @else {
			<svg class="so-check-box__mark" so-role-icon="check"></svg>
		}
	}
</span>
