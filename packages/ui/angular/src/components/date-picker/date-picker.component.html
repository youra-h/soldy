<!--
	Корень — сам хост (`<div so-date-picker>`), якорь панели, поэтому шаблон —
	то, что внутри корня Vue, в том же порядке: поля по режиму и панель. Слоты
	контракта — шаблонами: clear (scope { clear } — команда DatePicker),
	trigger-icon — значок кнопки календаря, item (scope { item, text }) —
	содержимое дня календаря.

	Ниже оба режима: одна дата и диапазон — в разметке стоит один из них, по
	`mode`. Поля, календарь и его движок — экземпляры ядра DatePicker (`[ctrl]`,
	`[engine]`): размер, вариант, `disabled`, локаль, границы и значение им
	раздаёт ядро, а не разметка.

	Кнопка календаря и кнопка очистки у режимов одни и те же, поэтому они —
	шаблоны (`#trigger`, `#clearButton`), которые режим ставит на своё место.
-->
@if (state()['mode'] === 'single') {
	<!--
		Одна дата. Поле — готовый DateInput: коробка, части, кольцо фокуса и
		ошибка — его. Кнопки очистки и календаря — в его слотах `clear` и
		`trailing`, в этом порядке: обёртку слотов у конца поля держит тема
		DateInput.

		Поле и есть группа частей, поэтому имя DatePicker (`aria_label`,
		`aria_labelledBy`, `aria_describedBy`) уходит ему: так оно дойдёт и до
		частей там, где группы скринридер не объявляет. Набор `aria` DatePicker
		ложится на поле директивой набора, поверх его собственного: в нём ещё и
		то, что DatePicker'у даёт поле формы `Field`, — ссылки на подпись и
		справку и ошибка (`aria-invalid`).

		Шаблон `clear` поле получает, только когда в нём есть что рисовать —
		своя кнопка DatePicker'а или встроенная по `clearable`: шаблон
		непрозрачен, и поле не отличит пустой от заданного.
	-->
	<div
		so-date-input
		embedded="date-picker.field"
		class="so-date-picker__field"
		[ctrl]="instance()?.field"
		[aria_label]="aria_label"
		[aria_labelledBy]="aria_labelledBy"
		[aria_describedBy]="aria_describedBy"
		[so-attributes]="state()['aria']"
	>
		@if (slot('clear') || state()['clearable']) {
			<ng-template slot="clear">
				<ng-container [ngTemplateOutlet]="clearButton" />
			</ng-template>
		}
		<ng-template slot="trailing">
			<ng-container [ngTemplateOutlet]="trigger" />
		</ng-template>
	</div>
} @else {
	<!--
		Диапазон: поле начала, тире, поле конца и кнопки — одна коробка на
		корне. Поля внутри без своей рамки (тема, по контексту), кнопки — после
		поля конца, а не в его слоте: они работают со всем периодом, а не с
		концом. Тире — для глаза, скринридеру оно не нужно: поля называют свои
		концы сами — выходами плагина имён `names_start` и `names_end` от
		локали. Кнопка очистки — одна на период, перед кнопкой календаря, и
		очищает оба конца, в том числе набранные не до конца.
	-->
	<div
		so-date-input
		embedded="date-picker.start"
		class="so-date-picker__start"
		[ctrl]="instance()?.start"
		[aria_label]="state()['names_start']"
	></div>
	<span class="so-date-picker__dash" aria-hidden="true">–</span>
	<div
		so-date-input
		embedded="date-picker.end"
		class="so-date-picker__end"
		[ctrl]="instance()?.end"
		[aria_label]="state()['names_end']"
	></div>
	<ng-container [ngTemplateOutlet]="clearButton" />
	<ng-container [ngTemplateOutlet]="trigger" />
}
<!--
	Кнопка очистки — DatePicker'а, а не поля: DatePicker сам поле (база
	`TClearable`) и очищает своё значение целиком, а `clear` шлёт он, в обоих
	режимах одинаково. Полям `clearable` не уходит, своих кнопок они не рисуют.

	Своя кнопка — шаблон `clear` DatePicker'а с его командой в scope: заменяет
	встроенную целиком и рисуется, когда задана. Встроенная — по `clearable`,
	выключена вместе с DatePicker, `readonly` её не гасит. Имя ядро собирает с
	именем DatePicker (`clearAria`), очищает его команда `clear`, клик до корня
	не всплывает. Вида у кнопки нет — тема красит её по контексту
	(`.so-date-picker__clear`).
-->
<ng-template #clearButton>
	@if (slot('clear'); as clear) {
		<ng-container
			[ngTemplateOutlet]="clear"
			[ngTemplateOutletContext]="{ clear: instance()?.clear }"
		/>
	} @else if (state()['clearable']) {
		<button
			so-button
			embedded="date-picker.clear"
			type="button"
			class="so-date-picker__clear"
			[size]="state()['size']"
			[disabled]="state()['disabled']"
			[so-attributes]="state()['clearAria']"
			(click)="clearClick($event)"
		>
			<svg
				so-icon
				embedded="date-picker.clear-icon"
				so-role-icon="close"
				[size]="state()['size']"
			></svg>
		</button>
	}
</ng-template>
<!--
	Кнопка календаря. Вида нет: тема красит её по контексту. Пока панель
	открыта, она нажата (`data-selected`). Связку с панелью (`aria-haspopup`,
	`aria-expanded`, `aria-controls`) и имя кнопка получает набором
	`triggerAria`, а выключена она, когда открыть панель нельзя — у
	выключенного и только для чтения. Нажатие ловит плагин открытия на корне.
	Значок — шаблон `trigger-icon`, по умолчанию иконка роли `calendar` — без
	своего размера: по кеглю кнопки.
-->
<ng-template #trigger>
	<button
		so-button
		embedded="date-picker.trigger"
		type="button"
		class="so-date-picker__trigger"
		[size]="state()['size']"
		[disabled]="!state()['openable']"
		[so-attributes]="{ ...state()['triggerAria'], ...state()['triggerDataset'] }"
	>
		@if (slot('trigger-icon'); as icon) {
			<ng-container [ngTemplateOutlet]="icon" />
		} @else {
			<svg so-icon embedded="date-picker.trigger-icon" so-role-icon="calendar"></svg>
		}
	</button>
</ng-template>
<!--
	Панель — Frame: телепорт в `body`, слой, привязка к корню, пометка
	владельцем. Поверхность, кромка и тень — как у панелей Select и Popover.
	Открытость — `[visible]` от `open`, как у Select: закрытая панель
	прячется, а не размонтируется. Подложки и крестика нет — нажатие мимо
	закрывает панель.

	Якорь — корень (`rootElement()` базы): панель встаёт под ним от его начала,
	а у нижнего края окна — над ним (сторону выбирает `TAnchorPlugin`); на
	сервере и до первой отрисовки якоря нет, как и самого слоя. Своего
	`rendered` панель не получает: корень Angular только прячется, а панель
	увезена в `body`, и её прячет признак поддерева базы, как у Select.
	`visible` DatePicker ей тоже не передаётся, как у Vue, где `v-show` корня
	до телепортированной панели не доходит.

	На панель ложатся `panelAria` (`role="dialog"`, `aria-modal`, имя и `id`, на
	который ссылается `aria-controls` кнопки), `panelDataset` (признак «тянут»,
	`data-swiping`) и пометка владельцем `dismiss_ownerAttribute` — одним
	объектом: директива набора на элементе одна. `tabindex="-1"` — фокус встаёт
	на саму панель, когда внутри нечего фокусировать.
-->
<div
	so-frame
	embedded="date-picker.frame"
	class="so-date-picker__panel"
	tabindex="-1"
	position="fixed"
	[visible]="state()['open']"
	[anchor_anchor]="rootElement()"
	[anchor_offset]="4"
	[so-attributes]="{
		...state()['panelAria'],
		...state()['panelDataset'],
		...state()['dismiss_ownerAttribute'],
	}"
>
	<!--
		Полоса, за которую панель тянут, — пока жест включён. Потребитель её не
		адресует, скринридеру она не нужна (`aria-hidden`); ставит её тема у края
		со стороны поля.
	-->
	@if (state()['handleRendered']) {
		<div class="so-date-picker__handle" aria-hidden="true"></div>
	}
	<!--
		Содержимое — обёртка календаря, и прокручивается она, а не панель: пока
		жест включён, плагин жеста отдаёт касание вдоль оси панели жесту.

		Календарь — готовый Calendar над экземпляром и движком ядра DatePicker.
		Своей поверхности у него нет, её даёт панель. Содержимое дня — шаблон
		`item` DatePicker'а, отданный календарю под тем же именем, с его scope
		`{ item, text }`, — только когда задан: шаблон непрозрачен.

		Подвал — шаблон `footer` календарю, только при `confirmable`: выбор в
		календаре тогда черновик, и значением его делает «OK» (`confirm()` ядра).
		«Отмена» закрывает панель, а черновик сбрасывает само закрытие. «Отмена»
		первой, «OK» — последней остановкой Tab. Пока диапазон выбран
		наполовину, «OK» выключена (`confirmDisabled`). Текст — строки локали,
		выходы плагина имён. Вида нет: тема красит кнопки по контексту.
	-->
	<div class="so-date-picker__content">
		<div
			so-calendar
			embedded="date-picker.calendar"
			class="so-date-picker__calendar"
			[ctrl]="instance()?.calendar"
			[engine]="instance()?.engine"
		>
			@if (slot('item'); as content) {
				<ng-template slot="item" let-item="item" let-text="text">
					<ng-container
						[ngTemplateOutlet]="content"
						[ngTemplateOutletContext]="{ item, text }"
					/>
				</ng-template>
			}
			@if (state()['confirmable']) {
				<ng-template slot="footer">
					<button
						so-button
						embedded="date-picker.cancel"
						type="button"
						class="so-date-picker__cancel"
						[size]="state()['size']"
						[text]="state()['names_cancel']"
						(click)="close()"
					></button>
					<button
						so-button
						embedded="date-picker.confirm"
						type="button"
						class="so-date-picker__confirm"
						[size]="state()['size']"
						[disabled]="state()['confirmDisabled']"
						[text]="state()['names_confirm']"
						(click)="confirm()"
					></button>
				</ng-template>
			}
		</div>
	</div>
</div>
