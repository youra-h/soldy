<!--
	Корень — сам хост (`<div so-select-group>`), поэтому шаблон — подпись и
	опции. Подпись — пока `label` не пуст: без неё нет и узла, а ссылку на него
	снимает плагин имени. `<ng-content>` — один раз и вне `@if`: иначе
	содержимое терялось бы при смене ветки.
-->
@if (state()['label']) {
	<div class="so-select-group__label" [so-attributes]="state()['labelAria']">
		{{ state()['label'] }}
	</div>
}
<ng-content />
