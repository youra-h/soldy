<!-- Новый контекст вывод отдаёт тому же представлению: фокус на триггере переживает показ. -->
@if (slot('trigger'); as trigger) {
	<ng-container
		[ngTemplateOutlet]="trigger"
		[ngTemplateOutletContext]="{ triggerAria: state()['triggerAria'] ?? {} }"
	/>
}
<!-- Наборы панели — одним объектом: директива набора на элементе одна. -->
<div
	so-frame
	embedded="tooltip.frame"
	class="so-tooltip__panel"
	position="fixed"
	[visible]="state()['open']"
	[anchor_anchor]="rootElement()"
	[anchor_placement]="state()['placement']"
	[anchor_offset]="6"
	[so-attributes]="{ ...state()['aria'], ...state()['dismiss_ownerAttribute'] }"
>
	<!-- Обёртка держит ширину панели по тексту, где бы у края окна панель ни стояла. -->
	<div class="so-tooltip__content">
		<ng-content />
	</div>
</div>
<!-- Слив шаблонов слотов: в основной проекции их якоря легли бы в панель. -->
<ng-content select="ng-template[slot]" />
