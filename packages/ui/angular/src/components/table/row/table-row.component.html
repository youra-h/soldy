<!-- Чекбокс — только в этой ветке: геттер item-адаптера таблицы его создаёт. -->
@if (state()['selecting']) {
	<td class="so-table-row__select" [so-attributes]="state()['cellAria']">
		<span
			so-check-box
			embedded="table.select"
			[ctrl]="facade()?.context?.adapters.table.checkBox"
			[aria_labelledBy]="state()['rowHeaderId']"
		></span>
	</td>
}
<!--
	Ветка по шаблону — над петлёй: `@if` в ячейке — ещё якорь и представление на каждую.
	Ключ — колонка ячейки: новая запись строки рисуется в тех же узлах, с фокусом сетки.
-->
@if (slot('cell'); as content) {
	@for (cell of state()['cells'] ?? []; track cell.column.uid) {
		@if (cell.rowHeader) {
			<th
				class="so-table-row__cell"
				scope="row"
				[so-attributes]="{ ...cell.dataset, ...state()['cellAria'], ...cell.aria }"
			>
				<ng-container
					[ngTemplateOutlet]="content"
					[ngTemplateOutletContext]="{
						row: instance(),
						column: cell.column,
						value: cell.value,
					}"
				/>
			</th>
		} @else {
			<td
				class="so-table-row__cell"
				[so-attributes]="{ ...cell.dataset, ...state()['cellAria'], ...cell.aria }"
			>
				<ng-container
					[ngTemplateOutlet]="content"
					[ngTemplateOutletContext]="{
						row: instance(),
						column: cell.column,
						value: cell.value,
					}"
				/>
			</td>
		}
	}
} @else {
	<!--
		Текст — свойством, а не интерполяцией: Prettier переносит содержимое ячейки на свою
		строку, и Angular оставил бы пробелы по краям.
	-->
	@for (cell of state()['cells'] ?? []; track cell.column.uid) {
		@if (cell.rowHeader) {
			<th
				class="so-table-row__cell"
				scope="row"
				[so-attributes]="{ ...cell.dataset, ...state()['cellAria'], ...cell.aria }"
				[textContent]="cell.text"
			></th>
		} @else {
			<td
				class="so-table-row__cell"
				[so-attributes]="{ ...cell.dataset, ...state()['cellAria'], ...cell.aria }"
				[textContent]="cell.text"
			></td>
		}
	}
}
