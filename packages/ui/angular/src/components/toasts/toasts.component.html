<!-- Приложение — вне ветки региона: оно рисуется и без региона, и на сервере. -->
<ng-content />
<!--
	Регион есть, только пока слой на месте (`placed()`): на сервере, до первой
	отрисовки и без цели его нет. На месте он стоит всегда: живая область — до первого тоста.
-->
@if (placed()) {
	<section #root>
		<!--
			Слоты тоста — только заданные, шаблонами в его слив (`ngProjectAs`):
			в основной проекции они сняли бы запасной текст.
		-->
		<ol class="so-toasts__list">
			@for (item of state()['shown'] ?? []; track item.uid) {
				<li so-toasts-item [ctrl]="item">
					@if (slot('item-icon'); as icon) {
						<ng-template slot="icon" ngProjectAs="ng-template[slot]" let-type="type">
							<ng-container
								[ngTemplateOutlet]="icon"
								[ngTemplateOutletContext]="{ item, type }"
							/>
						</ng-template>
					}
					@if (slot('item'); as heading) {
						<ng-template slot="default" ngProjectAs="ng-template[slot]" let-text="text">
							<ng-container
								[ngTemplateOutlet]="heading"
								[ngTemplateOutletContext]="{ item, text }"
							/>
						</ng-template>
					}
					@if (slot('item-content'); as content) {
						<ng-template slot="content" ngProjectAs="ng-template[slot]">
							<ng-container
								[ngTemplateOutlet]="content"
								[ngTemplateOutletContext]="{ item }"
							/>
						</ng-template>
					}
					@if (slot('item-close-icon'); as closeIcon) {
						<ng-template slot="close-icon" ngProjectAs="ng-template[slot]">
							<ng-container
								[ngTemplateOutlet]="closeIcon"
								[ngTemplateOutletContext]="{ item }"
							/>
						</ng-template>
					}
				</li>
			}
		</ol>
	</section>
}
<!-- Шаблоны слотов менеджера — в слив в конце, вне ветки: иначе их якоря легли бы в приложение. -->
<ng-content select="ng-template[slot]" />
