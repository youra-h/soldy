<!--
	Хост (`<div so-toasts>`) — обёртка без коробки вокруг приложения, как
	`LocaleProvider`: приложение — основная проекция, своей разметки вокруг него
	нет. Регион с тостами — корень `#root`, второй узел шаблона: база уводит его
	в цель слоя (`target`), а на месте оставляет якорь. Проекция стоит вне ветки
	региона: приложение рисуется и без региона, и на сервере.

	Слоты контракта: default — приложение; item, item-icon, item-content и
	item-close-icon — слоты тостов, шаблонами.
-->
<ng-content />
<!--
	Регион есть, только пока слой на своём месте (`placed` базы): на сервере, до
	первой отрисовки и без цели его нет, а вернувшаяся цель рисует его заново.
	На месте он стоит всегда, и пустым: живая область должна быть в документе до
	первого тоста. Места он не занимает и нажатий мимо тостов не ловит — это
	тема.

	На нём — от базы: место — модификатор `so-toasts--placement-*` и раскладка —
	`so-toasts--layout-*` (оба стоят всегда), номер слоя — `z-index`
	(`layout_styles`) и `data-layer`, `role="region"`, `aria-live` и имя из
	локали («Уведомления (F8)»), `dir`; раньше них — всё, что потребитель
	написал на `div`. Колесо и стрелки стопки слушает на нём плагин стопки.
-->
@if (placed()) {
	<section #root>
		<!--
			Тост — по одному на каждый показанный (`shown`), новый — первым: на
			экране он у края окна, а список растёт от края. Ключ — `uid` тоста.

			Слоты тоста пробрасываются целиком и только заданные: пустой шаблон
			Angular от заданного не отличает. `item-<слот>`, scope — scope слота
			тоста плюс сам тост. Тост берёт их шаблоном (`<ng-template slot>`):
			запрос слотов тоста видит корень ветки `@if`, лежащей прямо в нём, как
			своего ребёнка, а `ngProjectAs` уводит ветку в слив шаблонов тоста —
			в его основной проекции она сняла бы запасной текст. Без проброса тост
			рисует своё: значок вида, текст, `render`, иконку крестика.
		-->
		<ol class="so-toasts__list">
			@for (item of state()['shown'] ?? []; track item.uid) {
				<li so-toasts-item [ctrl]="item">
					@if (slot('item-icon'); as icon) {
						<ng-template slot="icon" ngProjectAs="ng-template[slot]" let-type="type">
							<ng-container
								[ngTemplateOutlet]="icon"
								[ngTemplateOutletContext]="{ item, type }"
							/>
						</ng-template>
					}
					@if (slot('item'); as heading) {
						<ng-template slot="default" ngProjectAs="ng-template[slot]" let-text="text">
							<ng-container
								[ngTemplateOutlet]="heading"
								[ngTemplateOutletContext]="{ item, text }"
							/>
						</ng-template>
					}
					@if (slot('item-content'); as content) {
						<ng-template slot="content" ngProjectAs="ng-template[slot]">
							<ng-container
								[ngTemplateOutlet]="content"
								[ngTemplateOutletContext]="{ item }"
							/>
						</ng-template>
					}
					@if (slot('item-close-icon'); as closeIcon) {
						<ng-template slot="close-icon" ngProjectAs="ng-template[slot]">
							<ng-container
								[ngTemplateOutlet]="closeIcon"
								[ngTemplateOutletContext]="{ item }"
							/>
						</ng-template>
					}
				</li>
			}
		</ol>
	</section>
}
<!--
	Шаблоны слотов, которые потребитель написал в менеджере
	(`<ng-template slot="item">`), — в слив, в конце и вне ветки: Angular считает
	их содержимым, и в основной проекции их якоря легли бы среди приложения.
-->
<ng-content select="ng-template[slot]" />
