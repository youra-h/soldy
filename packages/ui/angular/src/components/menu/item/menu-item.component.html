<!--
	Корень — сам хост (`<div so-menu-item>`), строка — `Button` на `div`, помечена
	`#control`: на неё ложится то, что потребитель написал на корне, кроме класса
	и стиля, а директива набора кладёт `aria` пункта. Размер и `disabled` —
	пункта; вида и варианта строка не получает: вид ей даёт тема по контексту, а
	цвет она берёт с пункта и панели. Слоты контракта: leading, default (scope
	{ text }), trailing.

	Значок и подсказка сочетания — в обёртках колонок у каждого пункта: пустая
	обёртка места не занимает, а если значок есть хоть у одного пункта меню,
	держит его колонку. Пустые обёртки тема прячет по `:empty`, поэтому внутри
	них — только проекция.
-->
<div
	so-button
	#control
	embedded="menu.row"
	[size]="state()['size']"
	[disabled]="state()['disabled']"
	[so-attributes]="state()['aria']"
	(click)="choose()"
>
	<span class="so-menu-item__icon" ngProjectAs="[slot=leading]">
		<ng-content select="[slot=leading]" />
	</span>
	@if (slot('default'); as content) {
		<ng-container
			[ngTemplateOutlet]="content"
			[ngTemplateOutletContext]="{ text: state()['text'] ?? '' }"
		/>
	} @else {
		<ng-content>{{ state()['text'] }}</ng-content>
	}
	<span class="so-menu-item__shortcut" ngProjectAs="[slot=trailing]">
		<ng-content select="[slot=trailing]" />
	</span>
</div>
<ng-content select="ng-template[slot]" />
