<!--
	Текст строки — слот `header`, а не `default`: `default` — содержимое панели.
-->
<div
	so-button
	#control
	embedded="menu.row"
	[size]="state()['size']"
	[disabled]="state()['disabled']"
	[so-attributes]="state()['aria']"
	(click)="facade()?.context?.adapters.menu.open()"
>
	<span class="so-menu-item__icon" ngProjectAs="[slot=leading]">
		<ng-content select="[slot=leading]" />
	</span>
	@if (slot('header'); as header) {
		<ng-container
			[ngTemplateOutlet]="header"
			[ngTemplateOutletContext]="{
				text: state()['text'] ?? '',
				open: state()['open'] ?? false,
			}"
		/>
	} @else {
		<ng-content select="[slot=header]">{{ state()['text'] }}</ng-content>
	}
	<!--
		Класс — на обёртке: тема зеркалит стрелку в RTL, и стрелка из слота зеркалится так же.
	-->
	<span class="so-menu-item__arrow" aria-hidden="true" ngProjectAs="[slot=trailing]">
		@if (slot('arrow-icon'); as arrow) {
			<ng-container [ngTemplateOutlet]="arrow" />
		} @else {
			<svg
				so-icon
				embedded="menu.arrow"
				so-role-icon="arrowRight"
				[size]="state()['size']"
			></svg>
		}
	</span>
</div>
<!--
	`lazyMount` действует только на проекцию: обёртка остаётся, панель не размонтируется.
-->
<div
	so-frame
	embedded="menu.popover-item-frame"
	class="so-menu-item__panel"
	tabindex="-1"
	position="fixed"
	anchor_placement="end-start"
	[visible]="state()['open']"
	[anchor_anchor]="rootElement()"
	[so-attributes]="{ ...state()['panelAria'], ...state()['dismiss_ownerAttribute'] }"
>
	<div class="so-menu-item__content">
		@if (state()['contentRendered']) {
			<ng-content />
		}
	</div>
</div>
<!--
	Шаблоны слотов — в слив в конце: в основной проекции их якоря легли бы в панель.
-->
<ng-content select="ng-template[slot]" />
