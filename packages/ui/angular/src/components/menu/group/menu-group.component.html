<!--
	Корень — сам хост (`<div so-menu-group>`), поэтому шаблон — подпись и пункты.
	Подпись — пока `label` не пуст: без неё нет и узла, а ссылку на него снимает
	плагин имени. Текст подписи — без пробелов вокруг: по нему подпись называет
	группу. `<ng-content>` — один раз и вне `@if`: иначе содержимое терялось бы
	при смене ветки.
-->
@if (state()['label']; as label) {
	<div class="so-menu-group__label" [so-attributes]="state()['labelAria']">{{ label }}</div>
}
<ng-content />
