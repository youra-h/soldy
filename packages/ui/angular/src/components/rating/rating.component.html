<!--
	Корень — сам хост (`<span so-rating>`), поэтому шаблон — дорожка: ряд звёзд
	и невидимая ручка с полем. Слот контракта: icon (scope { value, filled }).

	Дорожка — ряд звёзд. Ячейки равные и встык, поэтому доля её коробки по оси
	— доля шкалы: точку указателя в значение переводят по дорожке, не зная о
	звёздах. Ручку и поле плагины находят по классам и только прямыми детьми,
	как у Slider: `__thumb` — ребёнок дорожки, `input` — ребёнок ручки.
-->
<span class="so-rating__track">
	<!--
		Звезда — по одной на единицу шкалы, под `aria-hidden`: значение объявляет
		поле. Доля заливки — в стиле звезды (`--so-rating-fraction`, число от 0
		до 1), от предпросмотра наведением, пока он идёт, иначе от значения.
		Слоёв два, оба — одна иконка: пустая звезда снизу и залитая сверху, в
		слое, обрезанном по доле. Поэтому заливка бывает любой долей, а не только
		половиной.

		Иконка — `<svg>` роли `star`, а не компонент Icon, как отметка CheckBox:
		иконок по две на звезду, а оценок в списке отзывов — десятки. Размер и
		цвет ей даёт тема по слою. Шаблон слота `icon` заменяет иконку в обоих
		слоях; какой слой он рисует, говорит `filled`, какую звезду — `value`.
	-->
	@for (star of state()['stars'] ?? []; track star.value) {
		<span class="so-rating__star" [style]="star.style" aria-hidden="true">
			@if (slot('icon'); as icon) {
				<ng-container
					[ngTemplateOutlet]="icon"
					[ngTemplateOutletContext]="{ value: star.value, filled: false }"
				/>
			} @else {
				<svg class="so-rating__icon" so-role-icon="star"></svg>
			}
			<span class="so-rating__star-fill">
				@if (slot('icon'); as icon) {
					<ng-container
						[ngTemplateOutlet]="icon"
						[ngTemplateOutletContext]="{ value: star.value, filled: true }"
					/>
				} @else {
					<svg class="so-rating__icon" so-role-icon="star"></svg>
				}
			</span>
		</span>
	}
	<!--
		Ручка — невидимая, во весь ряд: в ней поле, и кольцо фокуса тема рисует
		на ней — вокруг всего ряда.
	-->
	<span class="so-rating__thumb">
		<!--
			Нативное поле, как у Slider: мобильный скринридер двигает его своим
			жестом, `name`, `disabled` и отправку формы даёт браузер, ARIA-дублей
			ему нет. Ход — от 0 до `max`, шаг — оценки. Значение пишет директива
			текста поля — после хода, и только разошедшееся с узлом. `id` — вход
			оценки: на него ведёт `for` подписи. Имя — из набора `aria`, там же
			`aria-valuetext` («4 из 5») и `aria-readonly` оценки только для показа:
			`readonly` поле не знает. Тема делает его прозрачным во всю ручку и не
			пускает к нему указатель: оценку ставит плагин, а не браузер.
		-->
		<input
			class="so-rating__input"
			type="range"
			min="0"
			[max]="state()['max']"
			[step]="state()['step']"
			[so-field-text]="state()['value'] | soText"
			[attr.id]="state()['id'] ?? null"
			[attr.name]="state()['name'] ?? null"
			[disabled]="state()['disabled'] === true"
			[so-attributes]="state()['aria']"
		/>
	</span>
</span>
