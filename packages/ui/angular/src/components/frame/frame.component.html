<!--
	Корень — сам хост (`<div so-frame>`), и в цель уезжает он, поэтому шаблон —
	только содержимое панели. Слот контракта — default.

	Содержимое рисуется, пока панель на своём месте — в цели или, с
	`contained`, на месте (`placed` базы). Слой есть только в браузере, как
	оверлей CDK: на сервере, до переноса и без цели панели нет.

	Содержимое остаётся в контексте места, где написан Frame: DI Angular идёт
	по дереву объявлений, а не по DOM, и компонент в панели получает локаль
	провайдера вокруг Frame.
-->
@if (placed()) {
	<ng-content />
}
