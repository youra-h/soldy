name: Release

# Публикация в npm (см. docs/agents/build.md, «Версии пакетов»). Публикует
# только мерж PR выпуска — ветки `release/v<версия>` (обычный мерж) или PR
# «Выпуск <версия>» (squash). Одной проверки «версии нет в npm» мало: версия,
# которую ни разу не выпускали (0.1.0), опубликовалась бы с любым push.
on:
  push:
    branches: [main]

# Два мержа подряд не публикуют одну версию дважды.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Публикация в npm
    if: contains(github.event.head_commit.message, 'release/v') || startsWith(github.event.head_commit.message, 'Выпуск ')
    runs-on: ubuntu-latest
    permissions:
      contents: write # теги и GitHub Release
      id-token: write # provenance npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Группа `fixed` идёт одной версией, поэтому хватает версии ядра. Уже в
      # npm — перезапуск после удачной публикации, делать нечего.
      - name: Версия опубликована?
        id: check
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@soldy-ui/core@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        name: Сборка пакетов
        run: npm run build

      - if: steps.check.outputs.publish == 'true'
        name: Импорты пакетов объявлены
        run: npm run check:published-imports

      # changeset publish публикует каждый пакет, чьей версии в npm нет, и
      # ставит теги `<пакет>@<версия>`.
      - if: steps.check.outputs.publish == 'true'
        name: Публикация
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Раздел версии у пакетов группы разный: changeset пишет пункт только
      # названным в нём пакетам. Поэтому в заметках — ссылки на CHANGELOG
      # каждого пакета на теге выпуска, а не раздел одного из них.
      - if: steps.check.outputs.publish == 'true'
        name: Теги и GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git push origin --tags
          {
            echo "Что изменилось — в CHANGELOG пакетов:"
            echo
            for f in $(git ls-files 'packages/**/CHANGELOG.md'); do
              name=$(node -p "require('./$(dirname "$f")/package.json').name")
              echo "- [$name]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$name@$VERSION/$f)"
            done
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --target "$GITHUB_SHA" --notes-file notes.md
