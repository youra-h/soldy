name: Release

# Publication to npm (docs/agents/build.md, «Версии пакетов»). Only the merge
# of a release PR publishes: a `release/…` branch (a merge commit) or a PR
# «Выпуск …» (squash). A check that a version is missing from npm is not
# enough on its own: a version never released (0.1.0) would go out with any
# push.
on:
  push:
    branches: [main]

# Two merges in a row do not publish one version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Публикация в npm
    if: contains(github.event.head_commit.message, 'release/') || startsWith(github.event.head_commit.message, 'Выпуск ')
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and the GitHub Release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Every package is checked at its own version: the library shares one,
      # each theme and icon pack has its own. None missing from npm — a rerun
      # after a successful publication, nothing to do. The list goes to a file
      # and not through a pipe: the step shell has no `pipefail`, and a failed
      # check would read as «nothing to publish».
      - name: Что не опубликовано?
        id: check
        run: |
          node tools/release-notes/cli.mjs unpublished > "$RUNNER_TEMP/unpublished.txt"
          cat "$RUNNER_TEMP/unpublished.txt"
          if [ -s "$RUNNER_TEMP/unpublished.txt" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        name: Сборка пакетов
        run: npm run build

      - if: steps.check.outputs.publish == 'true'
        name: Импорты пакетов объявлены
        run: npm run check:published-imports

      # changeset publish publishes every package whose version npm does not
      # have and tags it `<package>@<version>`.
      - if: steps.check.outputs.publish == 'true'
        name: Публикация
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # In pre-mode changesets publishes under the tag of the mode (`alpha`),
      # and `npm i @soldy-ui/vue` without a version would install the release
      # before the suffix. Until a release without a suffix exists, `latest` is
      # the fresh pre-release (docs/agents/build.md, «Версии пакетов») — of
      # every package, at its own version. No publication condition: a rerun
      # after a failed step brings the tags along, and a repeat is harmless.
      - name: Тег latest — на выпуск
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node tools/release-notes/cli.mjs packages > "$RUNNER_TEMP/packages.txt"
          while read -r spec; do
            npm dist-tag add "$spec" latest
          done < "$RUNNER_TEMP/packages.txt"

      # One GitHub Release per release: `v<version>` of the library, and
      # without it — on the tag of its first package. The notes read every
      # package at its own version (tools/release-notes); a version with a
      # suffix makes it a pre-release.
      - if: steps.check.outputs.publish == 'true'
        name: Теги и GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --tags
          node tools/release-notes/cli.mjs release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" "$GITHUB_SHA" < "$RUNNER_TEMP/unpublished.txt"
