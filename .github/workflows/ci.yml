name: CI

# Ветки проверяются через PR, main — после мержа. Без фильтра по веткам пуш в
# ветку с открытым PR запускал CI дважды: раз на push, раз на pull_request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Тесты, типы, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Тема отдаёт dist/index.css, который подключает сборка Angular.
      # dist в .gitignore, поэтому собираем до всего остального.
      - name: Сборка темы
        run: npm run build --workspace=@soldy/theme-oren

      # Браузер для test:layout закреплён ревизией Playwright из package-lock,
      # поэтому кэш привязан к lock-файлу: апгрейд Playwright честно перекачает
      # новую ревизию. Системные библиотеки в кэш не попадают — ставим всегда.
      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Системные зависимости Chromium
        run: npx playwright install-deps chromium

      - name: Тесты
        run: |
          npm run test:core
          npm run test:eslint
          npm run test:setup
          npm run test:accessor
          npm run test:vue
          npm run test:react
          npm run test:svelte
          npm run test:solid
          npm run test:webc
          npm run test:theme
          npm run test:playground
          npm run test:layout

      - name: Типы — Core
        run: npx tsc --noEmit -p packages/core/tsconfig.json

      - name: Типы — Setup
        run: npx tsc --noEmit -p packages/setup/tsconfig.json

      - name: Типы — Vue
        run: |
          npm run build:types --workspace=@soldy/ui-vue
          npx vue-tsc --noEmit -p packages/ui/vue/tsconfig.json

      - name: Типы — Plugins
        run: npx tsc --noEmit -p packages/plugins/tsconfig.json

      # Стенд — единственное место, где компоненты рисуются всеми пропами разом
      # и в двух режимах (проп и экземпляр ядра). Молча сломавшаяся страница
      # обесценивает его целиком, поэтому типы проверяются наравне с адаптерами.
      - name: Типы — Playground
        run: |
          npx tsc --noEmit -p packages/playground/shared/tsconfig.json
          npx vue-tsc --noEmit -p packages/playground/vue/tsconfig.json

      - name: Типы — React
        run: npx tsc --noEmit -p packages/ui/react/tsconfig.json

      - name: Типы — Svelte
        run: npm run check --workspace=@soldy/ui-svelte

      - name: Типы — Solid
        run: npx tsc --noEmit -p packages/ui/solid/tsconfig.json

      - name: Типы — Web Components
        run: npx tsc --noEmit -p packages/ui/webc/tsconfig.json

      # Сгенерированные метаданные закоммичены: Angular AOT требует статические
      # массивы inputs/outputs. Если дескриптор изменили, а generate не запускали,
      # компонент молча разъедется с дескриптором.
      - name: Angular — дрейф сгенерированных метаданных
        run: |
          npm run generate --workspace=@soldy/ui-angular
          git diff --exit-code packages/ui/angular/src/generated

      # Сборки Angular здесь нет намеренно: `ng build` собирал демо-приложение
      # (`angular.json` → `_demo/index.html`), а `_demo` лежал в .gitignore и в
      # CI не попадал никогда — шаг не мог работать. Демо удалены, им на смену
      # пришёл packages/playground; когда Angular дорастёт до своего стенда,
      # сборка вернётся сюда уже настоящей.

      - name: Сборка стенда Vue
        run: |
          npm run build --workspace=@soldy/theme-oren
          npm run build --workspace=@soldy/playground-vue

  lint:
    name: Линт
    runs-on: ubuntu-latest
    # Пакеты чистятся от any по одному (см. AGENTS.md, «`any`: где он честный»).
    # Вычищенный пакет попадает в `lint:ci` и дальше роняет сборку, остальные
    # видны отчётом.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Линт вычищенных пакетов
        run: npm run lint:ci

      # Отчёт нужен глазами, а красный джоб — нет: continue-on-error всё равно
      # оставляет ✗ у джоба и шлёт письмо о падении. Гасим код возврата здесь.
      - name: Отчёт по остальным пакетам
        run: npx eslint . || true
