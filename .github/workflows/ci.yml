name: CI

# Branches are checked through their PR, main after the merge. Without the
# branch filter a push to a branch with an open PR ran CI twice: on push and on
# pull_request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests run as four jobs in parallel, the build and types as a fifth. As one
  # queue on a 4-core runner the test step grew to 24 minutes: the suites ran
  # one after another, though they don't depend on each other. Test jobs build
  # nothing (the browser run, only the theme CSS): tests and the stand import
  # their neighbours from source, which proves they need no build.
  unit:
    name: Тесты — ядро, setup, плагины, тема
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: |
          npm run test:core
          npm run test:eslint
          npm run test:min-peers
          npm run test:release-notes
          npm run test:install-smoke
          npm run test:side-effects
          npm run test:setup
          npm run test:plugins
          npm run test:theme

  # The matrix key isn't `adapter`: under that name the guard of tools/min-peers
  # (`workspace.spec.ts`) reads the matrix of lower bounds.
  adapters:
    name: Тесты — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      # A red adapter doesn't cancel the others.
      fail-fast: false
      matrix:
        suite: [vue, react, svelte, solid, webc, angular]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm run test:${{ matrix.suite }}

  playground:
    name: Тесты — стенд
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm run test:playground

  # The browser run, a leg per browser: Chromium and WebKit, the engine of
  # Safari and of every browser on iOS. In one leg the two browsers shared the
  # runner's pages, and the run took twice as long as either of them alone.
  layout:
    name: Тесты — браузер (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # A red browser doesn't stop the other one.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is pinned by the Playwright revision in package-lock, so its
      # cache follows the lock file: a Playwright upgrade honestly downloads the
      # new revision. System libraries don't go into the cache — they are
      # installed every time.
      - name: Кэш браузера Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Установка браузера
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Системные зависимости браузера
        run: npx playwright install-deps ${{ matrix.browser }}

      # A dropped connection to a tab (`VITEST_BROWSER_CONNECTION_CLOSED`)
      # doesn't name its cause: whether the OOM killer took the process, the
      # renderer crashed or the whole browser exited. So the memory of the
      # machine and of the browser processes goes to a file every 5 s, and on
      # failure the step below prints it with the kernel log. `DEBUG=pw:browser`
      # is the browser's own output and its exit code.
      #
      # It is test:layout for one browser: the theme CSS, which the browser run
      # checks, and the specs of the browser's project.
      - name: Тесты
        env:
          DEBUG: pw:browser
        run: |
          (
            while sleep 5; do
              echo "== $(date +%T)"
              free -m | sed -n 2p
              ps -eo pid=,rss=,args= --sort=-rss | awk '
                /headless_shell|chrom|WPE|MiniBrowser|node/ && !/awk/ {
                  name = $3; sub(/.*\//, "", name)
                  kind = name == "node" ? $4 : "browser"
                  if (match($0, /--type=[a-z-]+/)) kind = substr($0, RSTART + 7, RLENGTH - 7)
                  printf "%7d %6d МБ  %s %s\n", $1, $2 / 1024, name, kind
                }' | head -12
            done
          ) > "$RUNNER_TEMP/memory.log" 2>&1 &
          npm run build:css --workspace=@soldy-ui/theme-oren
          npm run test:browser --workspace=@soldy-ui/playground-vue -- --project "layout (${{ matrix.browser }})"

      # The same user scenario on all six platforms: the component's events and
      # the accessibility tree after every step, compared with Vue
      # (benchmarks/parity/README.md). The report goes to the log. It runs in
      # Chromium, so in its leg.
      - name: Сверка платформ
        if: matrix.browser == 'chromium'
        run: npm run test:parity

      - name: Память и журнал ядра при падении
        if: failure()
        run: |
          cat "$RUNNER_TEMP/memory.log"
          df -h /dev/shm
          sudo dmesg -T | grep -iE 'oom|killed process|out of memory|segfault|chrom|headless|wpe|minibrowser' || echo 'в журнале ядра — ничего о памяти и браузере'

  build:
    name: Сборка и типы
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Declarations come from the second step of each package's `build` (for
      # the Svelte and Angular adapters, the same pass of `svelte-package` and
      # ng-packagr), which resolves neighbours as packages, by their built
      # `.d.ts` — hence the order of the queue.
      - name: Сборка пакетов
        run: npm run build

      # Right after the build: what goes to npm is checked — the tarball files
      # (`npm pack --dry-run`), not the sources. A package declares in
      # dependencies or peerDependencies everything its JS, declarations and
      # Svelte components import: in the repository an undeclared package still
      # lies in the shared node_modules, while a consumer on pnpm doesn't have
      # it. An unbuilt package fails the check: its entry points aren't in the
      # tarball.
      - name: Импорты пакетов объявлены
        run: npm run check:published-imports

      # After the build as well: React Server Components (the Next.js App
      # Router) run every module a Server Component imports on the server,
      # where React has no state, effects or context, and only a module that
      # opens with 'use client' is handed over as a reference instead. The
      # bundle of a package on React marks its client modules; the step reads
      # the marks back from dist. An unbuilt package fails: its entries are not
      # there.
      - name: Директива 'use client' у модулей React
        run: npm run check:client-directive

      - name: Типы — Core
        run: npx tsc --noEmit -p packages/core/tsconfig.json

      - name: Типы — Setup
        run: npx tsc --noEmit -p packages/setup/tsconfig.json

      - name: Типы — Vue
        run: npx vue-tsc --noEmit -p packages/ui/vue/tsconfig.json

      - name: Типы — Plugins
        run: npx tsc --noEmit -p packages/plugins/tsconfig.json

      # A program per theme package: the tests — CSS guards and specs of the
      # layout plugins — the `setup/` behaviour and the build configs (for oren,
      # the Tailwind step too). Neighbours and their own behaviour are read from
      # source.
      - name: Типы — Themes
        run: |
          npx tsc --noEmit -p packages/themes/base/tsconfig.json
          npx tsc --noEmit -p packages/themes/oren/tsconfig.json

      # The stand is the only place where components are drawn with all their
      # props at once and in two modes (prop and core instance). A page broken
      # silently devalues it entirely, so its types are checked on a par with
      # the adapters. The shell is Vue (vue-tsc), and each framework's preview
      # host is a type program of its own, with its own markup: a line per host.
      # The `.svelte` of the Svelte host is checked by svelte-check, not tsc, and
      # the templates of the Angular host by ngc, as in the adapter package (no
      # emit: noEmit is in the host's tsconfig).
      - name: Типы — Playground
        run: |
          npx tsc --noEmit -p packages/playground/shared/tsconfig.json
          npx vue-tsc --noEmit -p packages/playground/vue/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/react/tsconfig.json
          npx svelte-check --tsconfig packages/playground/vue/src/hosts/svelte/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/solid/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/webc/tsconfig.json
          npx ngc -p packages/playground/vue/src/hosts/angular/tsconfig.json

      - name: Типы — React
        run: npx tsc --noEmit -p packages/ui/react/tsconfig.json

      - name: Типы — Svelte
        run: npm run check --workspace=@soldy-ui/svelte

      - name: Типы — Solid
        run: npx tsc --noEmit -p packages/ui/solid/tsconfig.json

      - name: Типы — Web Components
        run: npx tsc --noEmit -p packages/ui/webc/tsconfig.json

      # ngc, not tsc: besides TS it checks @Component templates (strictTemplates)
      # and AOT restrictions — say, a signal viewChild() outside a field
      # initializer (NG8110). No emit: noEmit is in the package's tsconfig, which
      # also excludes dist from the program — «Сборка пакетов» above built it.
      - name: Типы — Angular
        run: npx ngc -p packages/ui/angular/tsconfig.json

      # The generated metadata is committed: Angular AOT needs static inputs and
      # outputs arrays. A descriptor changed without running generate would
      # silently drift apart from its component.
      - name: Angular — дрейф сгенерированных метаданных
        run: |
          npm run generate --workspace=@soldy-ui/angular
          git diff --exit-code packages/ui/angular/src/generated

      # The icon list is committed ready too: the generator builds it from the
      # SVG next to it and writes an @license note on the icons' origin into its
      # header. With the SVG or the generator changed and generate not run, the
      # package would ship the old icons or the old note. The generator needs no
      # build.
      - name: Иконки — дрейф сгенерированного списка
        run: |
          npm run generate --workspace=@soldy-ui/icons-material
          npm run generate --workspace=@soldy-ui/icons-lucide
          git diff --exit-code packages/icons/material/src/index.ts packages/icons/lucide/src/index.ts

      # The stand is one: a Vue shell with framework hosts for previews, and the
      # hosts are built with it, each as a lazy chunk of its own. The Angular
      # host is built from the adapter sources, like the other hosts, by the
      # Angular compiler (the stand's `src/vite-angular.ts`), and its linker
      # finishes the Angular packages.
      #
      # The theme isn't rebuilt here: the root build above built it, and the
      # theme's build:css would wipe its own `dist/setup` — the CSS build has
      # `emptyOutDir`.
      - name: Сборка стенда
        run: npm run build --workspace=@soldy-ui/playground-vue

  # Lower bounds of the adapters' peers (docs/agents/build.md, «Версии пакетов»):
  # «Тесты — <адаптер>» runs the specs on the lock's versions, and without this
  # job nothing checked the promise of peerDependencies — so the Angular package
  # promised 21.1, while its menu worked right only from 22.1.6.
  min-peers:
    name: Минимальные версии
    runs-on: ubuntu-latest
    strategy:
      # A red adapter doesn't cancel the others: each has a bound of its own.
      fail-fast: false
      matrix:
        adapter: [vue, react, svelte, solid, angular]

    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22: the substitution needs npm 11. With npm 10 the root's
      # overrides don't reach the workspaces' dependencies, and the copy from the
      # adapter's devDependencies would stay at the lock's version —
      # «Проверка дерева» would catch it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The framework's packages at the adapter's lower peer bounds across the
      # whole tree: overrides in the root manifest and npm update by them. In the
      # runner only — the repository's manifest and lock don't change. The script
      # derives the list from the adapter's manifest; no version is written out
      # by hand.
      - name: Нижние границы peer
        run: node tools/min-peers/cli.ts pin @soldy-ui/${{ matrix.adapter }}

      # A copy of another version left in the tree would be picked up by the
      # specs or the test tools, and the run would be green for nothing.
      - name: Проверка дерева
        run: node tools/min-peers/cli.ts verify @soldy-ui/${{ matrix.adapter }}

      # Specs only: the build, types and the browser run go in jobs of their own.
      - name: Спеки
        run: npm run test:${{ matrix.adapter }}

  # The built packages, packed as npm publishes them, installed into a clean
  # project of each target — Vite with every adapter, Angular CLI, Nuxt,
  # Next.js, SvelteKit, SolidStart, Angular SSR (docs/agents/build.md,
  # «Прогон установки»). The tests read the neighbors from sources and never
  # see a tarball: a file missing from `files`, an export condition, a
  # directive the bundler drops, the theme's CSS, a peer range. The project
  # installs with no peer problem, type-checks, builds, renders on the server
  # and comes alive in Chromium. The frameworks are the current versions of
  # the starters' ranges, as at a user who creates a project today.
  #
  # The key of the matrix is `project`: under it `tools/install-smoke` reads
  # the matrix against its table of projects (`projects.spec.ts`).
  install:
    name: Установка — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A red project does not stop the others: each is a target of its own.
      fail-fast: false
      matrix:
        project:
          [
            vue,
            react,
            svelte,
            solid,
            webc,
            angular,
            nuxt,
            next,
            sveltekit,
            solid-start,
            angular-ssr,
          ]

    steps:
      - uses: actions/checkout@v4

      # Node 24: SolidStart 2 requires it, and a new project is made on the
      # current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same browser as the layout run: the revision of package-lock.
      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Системные зависимости Chromium
        run: npx playwright install-deps chromium

      # The run packs what the build left in dist.
      - name: Сборка пакетов
        run: npm run build

      - name: Установка в чистый проект
        run: npm run check:install -- ${{ matrix.project }}

  lint:
    name: Линт
    runs-on: ubuntu-latest
    # Lint fails the build across the whole repository (AGENTS.md, «`any`: где он честный»).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Линт
        run: npm run lint:ci

      # An unformatted file is a trap for the next one to run `npm run format`:
      # their change would drown in someone else's lines.
      - name: Форматирование
        run: npx prettier --check .

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    # A PR that changes a library package carries .changeset/*.md (AGENTS.md,
    # «Версии пакетов»). On PRs only: on a push to main there is nothing to compare
    # with — HEAD there is origin/main, and the check would always be green. Not on
    # release/*: a release PR has its changesets removed already
    # (.claude/agents/developer.md, «Выпуск»).
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')

    steps:
      # Full history: changeset status looks for where the branch left
      # origin/main (git merge-base). The default clone is the PR's single merge
      # commit, without the main branch and without a common ancestor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A package changed and no changeset in the PR — exit code 1. An empty
      # changeset passes.
      - name: Changeset
        run: npx changeset status --since=origin/main

  # Comments, commits and CHANGELOG are in English (AGENTS.md, «Комментарии,
  # коммиты и CHANGELOG — на английском»). Comments are checked only on lines
  # the PR or the push to main added or changed: the translation is gradual.
  # Commits are guarded by the agent hook, not here: a task branch is never
  # rewritten, so a Russian commit in a PR could not be fixed.
  english:
    name: Английский
    runs-on: ubuntu-latest

    steps:
      # Full history: the diff against the base needs their merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Changeset
        run: node tools/english/changesets.mjs

      - name: Комментарии
        run: node tools/english/comments.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
