name: CI

# Ветки проверяются через PR, main — после мержа. Без фильтра по веткам пуш в
# ветку с открытым PR запускал CI дважды: раз на push, раз на pull_request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Тесты — четырьмя задачами параллельно, а сборка и типы — пятой. Одной
  # очередью на раннере в 4 ядра шаг тестов дорос до 24 минут: наборы шли друг
  # за другом, хотя друг от друга не зависят. Задачи тестов ничего не собирают
  # (браузерный прогон — только CSS темы): тесты и стенд ходят в соседей
  # исходниками, и этим доказано, что сборка им не нужна.
  unit:
    name: Тесты — ядро, setup, плагины, тема
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: |
          npm run test:core
          npm run test:eslint
          npm run test:min-peers
          npm run test:install-smoke
          npm run test:side-effects
          npm run test:setup
          npm run test:plugins
          npm run test:theme

  # Ключ матрицы — не `adapter`: под этим именем матрицу нижних границ читает
  # сторож tools/min-peers (`workspace.spec.ts`).
  adapters:
    name: Тесты — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      # Красный адаптер не снимает прогон остальных.
      fail-fast: false
      matrix:
        suite: [vue, react, svelte, solid, webc, angular]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm run test:${{ matrix.suite }}

  playground:
    name: Тесты — стенд
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm run test:playground

  layout:
    name: Тесты — браузер
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Браузер для test:layout закреплён ревизией Playwright из package-lock,
      # поэтому кэш привязан к lock-файлу: апгрейд Playwright честно перекачает
      # новую ревизию. Системные библиотеки в кэш не попадают — ставим всегда.
      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Системные зависимости Chromium
        run: npx playwright install-deps chromium

      # Обрыв связи с вкладкой (`VITEST_BROWSER_CONNECTION_CLOSED`) причины не
      # называет: убил ли процесс OOM killer, упал ли рендерер, вышел ли
      # Chromium целиком. Поэтому память машины и процессов браузера пишется в
      # файл каждые 5 с, а при падении её печатает шаг ниже вместе с журналом
      # ядра. `DEBUG=pw:browser` — вывод самого Chromium и код его выхода.
      #
      # test:layout сам собирает CSS темы — браузерный прогон проверяет его.
      - name: Тесты
        env:
          DEBUG: pw:browser
        run: |
          (
            while sleep 5; do
              echo "== $(date +%T)"
              free -m | sed -n 2p
              ps -eo pid=,rss=,args= --sort=-rss | awk '
                /headless_shell|chrom|node/ && !/awk/ {
                  name = $3; sub(/.*\//, "", name)
                  kind = name == "node" ? $4 : "browser"
                  if (match($0, /--type=[a-z-]+/)) kind = substr($0, RSTART + 7, RLENGTH - 7)
                  printf "%7d %6d МБ  %s %s\n", $1, $2 / 1024, name, kind
                }' | head -12
            done
          ) > "$RUNNER_TEMP/memory.log" 2>&1 &
          npm run test:layout

      # The same user scenario on all six platforms: the component's events and
      # the accessibility tree after every step, compared with Vue
      # (benchmarks/parity/README.md). The report goes to the log.
      - name: Сверка платформ
        run: npm run test:parity

      - name: Память и журнал ядра при падении
        if: failure()
        run: |
          cat "$RUNNER_TEMP/memory.log"
          df -h /dev/shm
          sudo dmesg -T | grep -iE 'oom|killed process|out of memory|segfault|chrom|headless' || echo 'в журнале ядра — ничего о памяти и браузере'

  build:
    name: Сборка и типы
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Декларации выпускает второй шаг `build` каждого пакета (у адаптеров
      # Svelte и Angular — тот же проход `svelte-package` и ng-packagr), и
      # соседей он резолвит как пакеты, то есть по их собранным `.d.ts`, —
      # отсюда порядок очереди.
      - name: Сборка пакетов
        run: npm run build

      # Сразу после сборки: проверяется то, что уедет в npm, — файлы тарболлов
      # (`npm pack --dry-run`), а не исходники. Пакет объявляет в dependencies
      # или peerDependencies всё, что импортируют его JS, декларации и
      # компоненты Svelte: в репозитории необъявленный пакет всё равно лежит в
      # общем node_modules, а у потребителя на pnpm его нет. Несобранный пакет
      # проверку не проходит — его точек входа нет в тарболле.
      - name: Импорты пакетов объявлены
        run: npm run check:published-imports

      # After the build as well: React Server Components (the Next.js App
      # Router) run every module a Server Component imports on the server,
      # where React has no state, effects or context, and only a module that
      # opens with 'use client' is handed over as a reference instead. The
      # bundle of a package on React marks its client modules; the step reads
      # the marks back from dist. An unbuilt package fails: its entries are not
      # there.
      - name: Директива 'use client' у модулей React
        run: npm run check:client-directive

      - name: Типы — Core
        run: npx tsc --noEmit -p packages/core/tsconfig.json

      - name: Типы — Setup
        run: npx tsc --noEmit -p packages/setup/tsconfig.json

      - name: Типы — Vue
        run: npx vue-tsc --noEmit -p packages/ui/vue/tsconfig.json

      - name: Типы — Plugins
        run: npx tsc --noEmit -p packages/plugins/tsconfig.json

      # Программа на пакет темы: тесты — сторожа CSS и спеки плагинов
      # раскладки, — поведение `setup/` и конфиги сборки (у oren — и шаг
      # Tailwind). Соседей и своё поведение они читают исходниками.
      - name: Типы — Themes
        run: |
          npx tsc --noEmit -p packages/themes/base/tsconfig.json
          npx tsc --noEmit -p packages/themes/oren/tsconfig.json

      # Стенд — единственное место, где компоненты рисуются всеми пропами разом
      # и в двух режимах (проп и экземпляр ядра). Молча сломавшаяся страница
      # обесценивает его целиком, поэтому типы проверяются наравне с адаптерами.
      # Оболочка — Vue (vue-tsc), а хост превью фреймворка — своя программа
      # типов со своей разметкой: строка на хост. `.svelte` хоста Svelte
      # проверяет svelte-check, а не tsc, а шаблоны хоста Angular — ngc, как у
      # пакета адаптера (эмита нет: noEmit в tsconfig хоста).
      - name: Типы — Playground
        run: |
          npx tsc --noEmit -p packages/playground/shared/tsconfig.json
          npx vue-tsc --noEmit -p packages/playground/vue/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/react/tsconfig.json
          npx svelte-check --tsconfig packages/playground/vue/src/hosts/svelte/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/solid/tsconfig.json
          npx tsc --noEmit -p packages/playground/vue/src/hosts/webc/tsconfig.json
          npx ngc -p packages/playground/vue/src/hosts/angular/tsconfig.json

      - name: Типы — React
        run: npx tsc --noEmit -p packages/ui/react/tsconfig.json

      - name: Типы — Svelte
        run: npm run check --workspace=@soldy-ui/svelte

      - name: Типы — Solid
        run: npx tsc --noEmit -p packages/ui/solid/tsconfig.json

      - name: Типы — Web Components
        run: npx tsc --noEmit -p packages/ui/webc/tsconfig.json

      # ngc, а не tsc: кроме TS проверяет шаблоны @Component (strictTemplates) и
      # ограничения AOT — например, сигнальный viewChild() вне инициализатора
      # поля (NG8110). Эмита нет: noEmit стоит в tsconfig пакета. Там же из
      # программы исключён dist — «Сборка пакетов» выше его уже собрала.
      - name: Типы — Angular
        run: npx ngc -p packages/ui/angular/tsconfig.json

      # Сгенерированные метаданные закоммичены: Angular AOT требует статические
      # массивы inputs/outputs. Если дескриптор изменили, а generate не запускали,
      # компонент молча разъедется с дескриптором.
      - name: Angular — дрейф сгенерированных метаданных
        run: |
          npm run generate --workspace=@soldy-ui/angular
          git diff --exit-code packages/ui/angular/src/generated

      # Список иконок тоже закоммичен готовым: генератор собирает его из SVG
      # рядом и пишет в шапку пометку @license о происхождении иконок. Если SVG
      # или генератор поправили, а generate не запускали, пакет уедет со старыми
      # иконками или со старой пометкой. Сборки генератор не требует.
      - name: Иконки — дрейф сгенерированного списка
        run: |
          npm run generate --workspace=@soldy-ui/icons-material
          npm run generate --workspace=@soldy-ui/icons-lucide
          git diff --exit-code packages/icons/material/src/index.ts packages/icons/lucide/src/index.ts

      # Стенд один: оболочка на Vue, превью — хосты фреймворков, и хосты
      # собираются вместе с ней, каждый своим ленивым куском. Хост Angular
      # собирает из исходников адаптера, как остальные хосты, компилятор Angular
      # (`src/vite-angular.ts` стенда), а пакеты Angular доводит его линкер.
      #
      # Тему здесь не пересобираем: её собрал корневой build выше, а build:css
      # темы вычистил бы её же `dist/setup` — у CSS-сборки `emptyOutDir`.
      - name: Сборка стенда
        run: npm run build --workspace=@soldy-ui/playground-vue

  # Нижние границы peer адаптеров (см. docs/agents/build.md, «Версии пакетов»):
  # «Тесты — <адаптер>» гоняют спеки на версиях из lock, и обещание в
  # peerDependencies без этой задачи ничем не проверялось — так пакет Angular
  # обещал 21.1, а меню в нём работало верно только с 22.1.6.
  min-peers:
    name: Минимальные версии
    runs-on: ubuntu-latest
    strategy:
      # Красный адаптер не снимает прогон остальных: граница у каждого своя.
      fail-fast: false
      matrix:
        adapter: [vue, react, svelte, solid, angular]

    steps:
      - uses: actions/checkout@v4

      # Node 24, а не 22: подмене нужен npm 11. У npm 10 overrides корня не
      # доходят до зависимостей воркспейсов, и копия из devDependencies адаптера
      # осталась бы версией lock — «Проверка дерева» её поймала бы.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Пакеты фреймворка — нижними границами peer адаптера во всём дереве:
      # overrides в манифесте корня и npm update по ним. Только в раннере —
      # манифест и lock репозитория не меняются. Список выводит скрипт из
      # манифеста адаптера, руками версии нигде не выписаны.
      - name: Нижние границы peer
        run: node tools/min-peers/cli.ts pin @soldy-ui/${{ matrix.adapter }}

      # Копию другой версии, оставшуюся в дереве, взяли бы спеки или инструменты
      # тестов, и прогон был бы зелёным впустую.
      - name: Проверка дерева
        run: node tools/min-peers/cli.ts verify @soldy-ui/${{ matrix.adapter }}

      # Только спеки: сборка, типы и браузерный прогон идут в своих задачах.
      - name: Спеки
        run: npm run test:${{ matrix.adapter }}

  # The built packages, packed as npm publishes them, installed into a clean
  # project of each target — Vite with every adapter, Angular CLI, Nuxt,
  # Next.js, SvelteKit, SolidStart, Angular SSR (docs/agents/build.md,
  # «Прогон установки»). The tests read the neighbors from sources and never
  # see a tarball: a file missing from `files`, an export condition, a
  # directive the bundler drops, the theme's CSS, a peer range. The project
  # installs with no peer problem, type-checks, builds, renders on the server
  # and comes alive in Chromium. The frameworks are the current versions of
  # the starters' ranges, as at a user who creates a project today.
  #
  # The key of the matrix is `project`: under it `tools/install-smoke` reads
  # the matrix against its table of projects (`projects.spec.ts`).
  install:
    name: Установка — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A red project does not stop the others: each is a target of its own.
      fail-fast: false
      matrix:
        project:
          [
            vue,
            react,
            svelte,
            solid,
            webc,
            angular,
            nuxt,
            next,
            sveltekit,
            solid-start,
            angular-ssr,
          ]

    steps:
      - uses: actions/checkout@v4

      # Node 24: SolidStart 2 requires it, and a new project is made on the
      # current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same browser as the layout run: the revision of package-lock.
      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Системные зависимости Chromium
        run: npx playwright install-deps chromium

      # The run packs what the build left in dist.
      - name: Сборка пакетов
        run: npm run build

      - name: Установка в чистый проект
        run: npm run check:install -- ${{ matrix.project }}

  lint:
    name: Линт
    runs-on: ubuntu-latest
    # Линт роняет сборку по всему репозиторию (см. AGENTS.md, «`any`: где он честный»).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Линт
        run: npm run lint:ci

      # Неотформатированный файл — ловушка для следующего, кто запустит
      # `npm run format`: его правка утонет в чужих строках.
      - name: Форматирование
        run: npx prettier --check .

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    # PR, который меняет библиотечный пакет, несёт .changeset/*.md (см. AGENTS.md,
    # «Версии пакетов»). Только на PR: на push в main сравнивать не с чем — HEAD там
    # и есть origin/main, и проверка была бы зелёной всегда. Не на release/*: в PR
    # выпуска changeset'ы уже удалены (см. .claude/agents/developer.md, «Выпуск»).
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')

    steps:
      # Полная история: changeset status ищет, где ветка отошла от origin/main
      # (git merge-base). Клон по умолчанию — один merge-коммит PR без ветки main
      # и без общего предка.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Пакет изменён, а changeset'а в PR нет — код 1. Пустой changeset проходит.
      - name: Changeset
        run: npx changeset status --since=origin/main

  # Comments, commits and CHANGELOG are in English (AGENTS.md, «Комментарии,
  # коммиты и CHANGELOG — на английском»). Comments are checked only on lines
  # the PR or the push to main added or changed: the translation is gradual.
  # Commits are guarded by the agent hook, not here: a task branch is never
  # rewritten, so a Russian commit in a PR could not be fixed.
  english:
    name: Английский
    runs-on: ubuntu-latest

    steps:
      # Full history: the diff against the base needs their merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Changeset
        run: node tools/english/changesets.mjs

      - name: Комментарии
        run: node tools/english/comments.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
